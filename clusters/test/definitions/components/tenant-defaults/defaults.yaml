apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: placeholder  # matched via the target selector in kustomization.yaml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isolation:
    mode: namespace
  mail:
    # No domain here. Absent, the operator derives it from the tenant and the
    # cluster's kernel domain — acme.desk.gentian.org under TENANCY_MODE=multi
    # — which is the same domain the platform derives the admin address in
    # (admin@acme.desk.gentian.org).
    #
    # Hardcoding the kernel domain gave every tenant the same mail domain, so
    # Postfix accepted desk.gentian.org and refused the tenant's own, and the
    # registry held one entry per tenant all naming it. Set this per tenant
    # only where a tenant genuinely owns a different domain.
    mode: selfhosted
    quotaPerUser: 2Gi
    rateLimit: 100/h

  # A CEILING on everything one tenant may request, not a reservation.
  #
  # Size it against this cluster's allocatable capacity minus what the kernel
  # already requests — not against another cluster's file. A quota larger than
  # the hardware admits tenants that can never schedule; a quota smaller than
  # the apps request rejects them at admission with a message about the quota
  # rather than about the app.
  #
  # Start here and measure: 'kubectl describe resourcequota -n tenant-<name>'
  # after the first app is installed tells you what it actually wanted.
  quotas:
    cpu: 4
    memory: 4Gi
    storage: 100Gi
    maxApps: 10
