# Cluster overlay — only what's unique to THIS cluster. Tier-wide policy
# lives in gentian-deployments/profiles/dev.yaml (Layer 2); chart
# defaults live in gentian-os/charts/gentian-os/values.yaml (Layer 1).
# Also read directly by the gentian-portal Application for kernelDomain
# (portal chart is separate from the operator chart but shares this file).
kernelDomain: desk.gentian.org
stage: dev
# Fallback for llm.enabled on claims/cluster.yaml: the operator reads the
# claim (via gentian-cluster-config) and consults this only while that
# ConfigMap does not exist yet. Keep it matching the claim so first boot
# behaves like steady state.
llmSupport: true

image:
  tag: "develop"

# Tenant export bundles are encrypted to these age public keys. Without at
# least one, an export fails rather than writing a tenant's data unencrypted.
#
# The matching identity is at ~/.gentian/backup-identity-test.txt on the
# operator's workstation and deliberately NOT on this cluster: a key stored in
# the cluster it protects is readable by whoever compromises that cluster,
# which is the case backups exist for. This is a dev-cluster key — a prod one
# belongs with the recovery kit.
# Live consumption for the Admin Console's Resources tab, read from
# metrics.k8s.io. microk8s serves it from its own core add-on, so this cluster
# needs no A-11-metrics-server run — the step's check() already reports
# satisfied against kube-system/metrics-server.
#
# Advisory only. What a tenant is billed for is the enforced ceiling and what
# is committed under it, both from the API server; this adds the second series
# that says whether the plan they pay for is the plan they need.
usage:
  metricsServer:
    enabled: true

backupRecipients:
  - age1tnesxqng2g538mxyv589hfkp49ukhqeaqq9fx4p74zapmyfdxggq45vx0v

api:
  env:
    BACKEND_CORS_ORIGINS: https://portal.desk.gentian.org

# Read by BOTH charts that share this file: the operator chart takes `enabled`
# and ignores `url`, the portal chart takes `url` and ignores `enabled`.
credentialManager:
  enabled: true
  url: http://gentian-os-credentials.gentian-system.svc:9444

# Also read by both charts, the same way credentialManager is: the operator
# chart takes `deployments` and ignores `url`, the portal chart takes `url` and
# ignores `deployments`.
appLifecycle:
  # Where the Admin Console's Resources tab reads a tenant's plan, ceiling and
  # usage history, and posts plan changes. Without it the tab reports the
  # resources API unreachable, which is what it did before this line existed.
  url: http://gentian-os-lifecycle.gentian-system.svc:8082
  deployments:
    enabled: true
    cluster: test
    repo: https://github.com/gentian-org/gentian-deployments
    gitCredentialsSecret: gentian-deployments-git-credentials
