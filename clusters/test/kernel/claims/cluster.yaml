apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: test-dev
  namespace: crossplane-system
spec:
  kernelDomain: desk.gentian.org

  # How traffic reaches this cluster.
  #   tunnel     behind a reverse proxy or tunnel; nodeIp is not used
  #   static-ip  DNS points straight at nodeIp, which is then required
  networkMode: tunnel
  # nodeIp:                      not used while networkMode is tunnel

  # Who issues TLS certificates.
  #   acme-dns01   Lets Encrypt over DNS-01; needs the Cloudflare API token
  #   acme-http01  Lets Encrypt over HTTP-01; needs port 80 reachable
  #   private-ca   your own CA, supplied as certificates.caBundleSecretRef
  #   self-signed  no public DNS and no ACME reachability; browsers warn
  certificates:
    issuerMode: acme-dns01
    # caBundleSecretRef:         only read when issuerMode is private-ca

  # Where mail goes.
  #   external  relay through an SMTP provider; supply the smtp-relay
  #             credential to the credential manager after install
  #   kernel    in-cluster Postfix/Dovecot; requires networkMode static-ip
  mail:
    serviceMode: external
    host: smtp.gmail.com
    # port: 587                 defaults to 587
    # starttls: true            defaults to true

  # Defaults below are in effect. Uncomment a line to change it.
  # tenancyMode:  multi      one subdomain and Keycloak realm per tenant; single = one tenant owns the cluster
  # secretMode:   derived    every kernel secret reproducible from the master password; random = independent
  # routingMode:  gateway    Envoy Gateway plus the Gateway API; the only supported value
  # storageClass: ""         empty means the clusters default StorageClass
  # Human logins to OpenBao and the credential manager. Setting discoveryUrl is
  # what creates the whole OIDC chain: the cluster-admin and tenant-admin
  # policies and roles, the Keycloak client OpenBao authenticates against, its
  # groups and tenant mappers, and the platform-admins group.
  oidc:
    discoveryUrl: https://id.desk.gentian.org/realms/kernel
    # Browser-facing OpenBao URL, used for the OIDC callback. OpenBao has no
    # external route on this cluster, so this only matters for logging into
    # OpenBao's own UI; the credential manager exchanges tokens server-side.
    externalUrl: https://bao.desk.gentian.org
    # The group D-05-portal-login puts administrator@<kernelDomain> into.
    #
    # Set explicitly rather than left to the XRD default: a default is
    # materialised into the object at admission, so changing it later does not
    # migrate a claim that already exists — this one was created while the
    # default was /platform-admins, a group nothing ever joins.
    clusterAdminGroup: "/gentian:platform:superadmin"

  llm:
    enabled: true
    gpuAcceleration: true
    # Matches the time-slicing already configured on this node: one physical
    # RTX 4090 presented as four shares. Lowering it would reduce the node's
    # GPU capacity for everything else.
    gpuTimeSliceReplicas: 4
    instances:
      - name: qwen
        modelId: Qwen/Qwen2.5-7B-Instruct
        # 0.85 of a 24 GB card is ~21 GB, which effectively dedicates it to
        # this model. Drop to a 1.5B at 0.30 to leave room for other GPU work.
        gpuMemoryUtilization: "0.85"
        maxModelLen: "8192"
        modelCacheSize: 60Gi
        toolCallParser: hermes
