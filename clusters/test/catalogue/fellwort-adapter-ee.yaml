# The Fellwort adapter: turns a tenant's Fellwort into tools for programs that
# act for a person -- a person's assistant through the MCP gateway, so that it
# can program Fellwort: read graphs (processes, cases, workflows, agents),
# start one, import a document, edit it with Fellwort's edit commands, check
# it, and keep versions. An MCP server at fellwort-adapter:8765/mcp whose
# tools are a fixed table (services/fellwort-adapter/server.py) over
# Fellwort's API.
#
# It holds no credential of Fellwort. Each call carries the token the
# tenant's chaperone obtained for the person and fellwort-ee, which goes on
# to Fellwort's API, so Fellwort decides what the call may see and change.
# Reading and changing only: deleting a graph, starting a run and invoking
# an action cannot be taken back, and are not offered. As an adapter it
# reaches fellwort-ee and nothing else in the tenant, and only the tenant's
# components that speak as a person reach it.
#
# It comes with Fellwort: the store lists it on Fellwort's page, and only a
# tenant holding fellwort-ee may acquire or pull it (services/store,
# STORE_ADAPTERS_REQUIRE). The chart and image are private packages of
# ghcr.io/aluvian-hq, pulled through registry.aluvian.io with the credential
# the store minted at acquisition.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: fellwort-adapter-ee
  labels:
    gentianos.io/profile-name: fellwort-adapter-ee
    gentianos.io/profile-edition: ee
spec:
  classes: [adapter]
  # Nobody opens it: agents call it.
  launch: none
  trustTier: certified
  version: "0.1.0-main.782e96f"
  requires:
    platform: ">=0.5"
  adapter:
    adapts:
      # Fellwort's API v1, which every build of it serves: no version is
      # named, so the adapter follows Fellwort's releases.
      profile: fellwort-ee
    # Where the tool server answers: the platform tells the tenant's
    # components that may call adapters (the chaperone) that it is there.
    endpoint:
      service: fellwort-adapter
      port: 8765
      path: /mcp
  package:
    chart:
      repository: "oci://registry.aluvian.io/aluvian-hq/charts"
      name: fellwort-adapter
      version: "0.1.0-main.782e96f"
    extraValues:
      # The Service callers reach the adapter at.
      fullnameOverride: fellwort-adapter
      # The chart's own image, through the registry; its tag stays the
      # chart's, which names the build it was packaged from.
      image:
        repository: registry.aluvian.io/aluvian-hq/fellwort-adapter
      # fellwort-ee's API Service, in the same namespace.
      fellwortApiUrl: http://fellwort-api:8000/api/v1
