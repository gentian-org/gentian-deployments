# The notary: keeps what a person has allowed an agent engine (a mandate),
# derives the permission for each execution of a graph from it (a run) and
# signs a short pass for a run, which the chaperone verifies on every tool
# call (services/notary, docs/agents.md).
#
# It holds one key, the one passes are signed with, and one database. It
# reaches no app and no agent bridge: which tools there are, the chaperone
# tells it. What a person may do with an app, and which installed action
# they may use, is the platform's answer.
#
# A person who allows a mandate that names tools is linked to the chaperone
# at the platform's registrar, with the token they are at the page with. That
# token is made out to the notary and good for nothing else there.
#
# A person says yes on the notary's own confirmation page, at an address of
# its own behind the tenant's sign-in. An engine sends the person there and
# can neither draw the page nor answer on it.
#
# It comes with Voles and is not offered on its own. The chart and image
# are private packages of ghcr.io/aluvian-hq, pulled through
# registry.aluvian.io.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: notary-ee
  labels:
    gentianos.io/profile-name: notary-ee
    gentianos.io/profile-edition: ee
  annotations:
    gentianos.io/store-listed: "false"
spec:
  classes: [app]
  # It has no tile and no app opens it as its own: engines and the chaperone
  # call it, and an engine sends a person to its confirmation page for one
  # request. With launch none the page's address is part of the tenant, so
  # whoever may enter the tenant reaches it, and the notary shows a request
  # to the person it names and to nobody else.
  launch: none
  # The rights check is given at this tier only.
  trustTier: platform
  version: "0.1.0-main.06fc841"
  package:
    chart:
      repository: "oci://registry.aluvian.io/aluvian-hq/charts"
      name: notary
      version: "0.1.0-main.06fc841"
    valueMapping:
      database:
        hostKey: database.host
        portKey: database.port
        nameKey: database.name
        userKey: database.user
        passwordKey: database.password
      platform:
        issuerKey: auth.issuer
        tenantKey: tenant
        # Where a person is linked to the chaperone when they allow a
        # mandate that names tools.
        registrarUrlKey: registrar.url
      integrations:
        # The credential of the notary's own contract: whoever presents it
        # is the engine the contract was granted to.
        mandates:
          passwordKey: engine.key
        # The credential of the contract the chaperone verifies passes by:
        # whoever presents it is the chaperone, telling which tools the
        # installed agent bridges offer.
        passes:
          passwordKey: chaperone.key
    extraValues:
      # The Service the chaperone and the engines reach it at.
      fullnameOverride: notary
      image:
        repository: registry.aluvian.io/aluvian-hq/notary
      # The Secret the platform writes for this component.
      rightsCheck:
        secretName: rights-check-notary-ee
      # The engine the contract mandates is for.
      engine:
        name: voles-ee
      # The component that acts for a person while they are away, which
      # names the notary as its consent page.
      vouching:
        profile: chaperone-ee
      # Tools that change data may be named in a mandate, each by name and
      # version, at the stage that carries changes out. A tool that cannot
      # be undone is called only in a run the person starts themselves, of a
      # graph without a model; no mandate ever names one.
      agentPolicy: '{"allow_change": true, "allow_irreversible": true}'
      auth:
        # At the notary's own address the front door hands it a token of the
        # person made out to this profile (exchangeToken, below). The
        # confirmation page's routes take that token and no other.
        ownAudience: notary-ee
        # The token the front door made out to Voles, which hands it on in a
        # run's start as the proof that the person is there. It answers no
        # request.
        audience: voles-ee
  requires:
    platform: ">=0.5"
    services:
      # Mandates and runs.
      database:
        engine: postgresql
      # May this person use this app, or this installed action: asked at every
      # grant, run start and pass.
      rights: {}
  # Where the chaperone fetches the key passes are verified against, once
  # the tenant's administrator has granted it the contract.
  provides:
    - name: passes
      protocol: http-json
      endpoint:
        service: notary
        port: 8000
    # What an engine asks: a run for a person, and passes for it. An engine
    # reaches it once the tenant's administrator has granted it the
    # contract.
    - name: mandates
      protocol: http-json
      endpoint:
        service: notary
        port: 8000
  expose:
    # The confirmation page and the two routes it calls, behind sign-in.
    # Each request reaches the notary with a token of the person for this
    # profile alone, which it verifies; no identity header is taken on
    # trust. Nothing else of the notary is served here: what engines and the
    # chaperone ask stays inside the cluster.
    - name: consent
      surface: gateway
      authMode: oidc
      exchangeToken: true
      subDomain: notary
      paths: ["/consent/", "/api/v1/consent/"]
      backend:
        service: notary
        port: 8000
  secrets:
    generated:
      # The key passes are signed with. The platform makes it once for the
      # install and keeps it across upgrades; a purge destroys it.
      - name: pass_signing_key
        format: ec-p256
        valuePath: signingKey.pem
