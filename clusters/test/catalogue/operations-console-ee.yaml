# The Operations Console: the convenience tier of looking after a tenant.
# Everything a tenant needs to own its data -- export now, import, purge --
# is the Admin Console's and free. What makes owning it convenient and
# reliable is here: scheduled backups, the backup policy with its external
# destination and retention, the bundles those produce; recovery, drills,
# ingest and egress as they arrive. The Admin Console promotes it from the
# places where a free flow has a paid continuation, and the install is free
# under fifty users. It is never required: nothing the OS promises depends on
# it being installed.
#
# Built from the same code as the Admin Console and deployed the same way: a
# client of the director that holds no credential of its own, no Kubernetes
# access and no database. What a person may see or change in it is the
# director's answer, and this profile is the whole statement about the
# component -- the catalogue carries it, not the OS's operator chart.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: operations-console-ee
  labels:
    gentianos.io/profile-name: operations-console-ee
    gentianos.io/profile-edition: ee
  annotations:
    # The store's listing of the Operations Console goes with the new name.
    gentianos.io/renamed-from: operations-console
    # Installed in every cluster's platform tenant (defaultForPlatform), so
    # there is nothing to offer in the App Store.
    gentianos.io/store-listed: "false"
    # Placed only on a cluster that reports usage statistics: with the
    # report off the operator places none and removes the ones it placed.
    gentianos.io/requires-usage-statistics: "true"
spec:
  classes: [app]
  # Reached from the Operations tile on the web exposure. The api exposure
  # carries none, which is what an API entry should be.
  launch: tile
  # Platform trust, because it relays the forwarded token to the director,
  # which forwardToken below requires.
  trustTier: platform
  version: "0.1.0-main.2e905f3"
  # The cluster has one, in the platform tenant, for the cluster's
  # administrators: it looks after every tenant through the director's
  # cluster routes, so no other tenant gets one of its own.
  defaultForPlatform: true
  package:
    chart:
      repository: "oci://ghcr.io/aluvian-hq/charts"
      name: "operations-console"
      version: "0.1.0-main.2e905f3"
    valueMapping:
      # Where the console's chart takes the facts of the cluster it runs in.
      # Every key matches the chart's values.yaml, which are the Admin
      # Console's: the two charts are the same shape on purpose, so the
      # operator maps both the same way. The director keys are what make this
      # a client of the director, and naming them is also what opens its
      # egress to the control namespace.
      platform:
        issuerKey: auth.issuer
        zoneClientIdKey: auth.clientId
        audienceKey: auth.audience
        directorUrlKey: director.url
        # Where live state is read. The backup screens show what exists on
        # the cluster now -- the runs, the policy in force, the next run of a
        # schedule -- and that is the usher's to answer; the director writes
        # git and serves none of it. Naming the key is what lets this reach
        # the usher.
        usherUrlKey: usher.url
        # Where a person's own credential writes go. This console relays two:
        # the copy of a backup key a person asked to have kept in the vault,
        # and the login of storage bundles are imported from; and whether each
        # is kept. Naming the key is what lets it reach the custodian.
        custodianUrlKey: custodian.url
        clusterKey: director.cluster
        tenantKey: platform.tenant
        kernelDomainKey: platform.kernelDomain
        realmKey: platform.realm
        zoneKindKey: platform.zoneKind
        # The tenant's own language, for what this renders before a person has
        # chosen one and before a settings template has chosen for them.
        defaultLanguageKey: platform.defaultLanguage
    extraValues:
      # The name every object of the release derives from, pinned so the
      # Services the exposures below route to are known before the release
      # exists.
      fullnameOverride: operations-console
      auth:
        disabled: false
        mode: edge
      gateway:
        enabled: false
      rbac:
        create: false
      networkPolicy:
        create: false
      api:
        env:
          ENVIRONMENT: production
  expose:
    # The API. It relays the caller's token to the director, which is why this
    # entry forwards the edge token, and why the profile is platform trust.
    - name: api
      surface: gateway
      authMode: oidc
      subDomain: operations
      paths: ["/api", "/healthz", "/readyz"]
      forwardToken: true
      backend:
        service: operations-console-api
        port: 8000
    # The bundle, on the same host so both share one session. The tile is
    # asked on the cluster: the console is for whoever may configure it, and
    # the platform asks the same at the edge of both entries of this host and
    # the console's API asks it again. The desktop opens it in a frame, which
    # the exposure's frame policy admits and nothing else does.
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: operations
      backend:
        service: operations-console-web
        port: 8080
      tile:
        displayName: Operations
        description: Scheduled backups, their destination and retention, the bundles they produce, and the record of who decided, changed and signed in.
        displayNames:
          de_DE: Betrieb
          en_US: Operations
        # logo, not icon: an exposure's tile carries its own PNG and the
        # schema requires it. The same frame as the Admin Console's cog,
        # with a hammer: the console where the tenant is looked after.
        logo: data:image/png;base64,
        relation: can_configure
        object: cluster
