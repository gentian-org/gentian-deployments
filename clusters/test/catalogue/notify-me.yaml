# notify-me: an action that puts a notice in the desktop inbox of the person
# who started the run, and of nobody else
# (services/notify). Its run holds no credential and reaches nothing but
# the chaperone that started it: it hands the notice over there, and the
# chaperone decides whom this action may tell and publishes the notice
# through the desktop's contract "notices".
#
# The image is a private package of ghcr.io/aluvian-hq, pulled through
# registry.aluvian.io by a tenant that holds Voles.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: notify-me
  labels:
    gentianos.io/profile-name: notify-me
    gentianos.io/profile-edition: pe
spec:
  classes: [action]
  # Nobody opens it: a graph's step runs it.
  launch: none
  trustTier: certified
  version: "0.1.0"
  package:
    # The one build a run starts. Publishing replaces this digest with that
    # of the image built with this commit.
    images:
      - repository: registry.aluvian.io/aluvian-hq/notify
        digest: sha256:317d03c46dddd391f7c43ba6528d6650ca5c8cc16615534b8a2811dcb9017c15
  action:
    # Reads the inputs on standard input, writes the outputs to standard
    # output.
    command: ["/notify"]
    deadlineSeconds: 60
    resources: {cpu: 100m, memory: 64Mi}
    inputs:
      type: object
      required: [title, body]
      properties:
        title: {type: string, maxLength: 200}
        body: {type: string, maxLength: 4000}
        severity: {type: string, enum: [info, warning, critical]}
        linkUrl: {type: string}
        linkLabel: {type: string, maxLength: 100}
    outputs:
      type: object
      properties:
        notice: {type: string}
  requires:
    platform: ">=0.5"
