# notify-people: an action that puts a notice in the desktop inbox of the
# people and positions its step names
# (services/notify). Its run holds no credential and reaches nothing but
# the chaperone that started it: it hands the notice over there, and the
# chaperone decides whom this action may tell and publishes the notice
# through the desktop's contract "notices".
#
# It can tell anybody of the tenant, so it does not come with Voles: the
# tenant's administrator installs it and says who may use it.
#
# The image is a private package of ghcr.io/aluvian-hq, pulled through
# registry.aluvian.io by a tenant that holds Voles.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: notify-people
  labels:
    gentianos.io/profile-name: notify-people
    gentianos.io/profile-edition: pe
spec:
  classes: [action]
  # Nobody opens it: a graph's step runs it.
  launch: none
  trustTier: certified
  version: "0.2.0"
  package:
    # The one build a run starts. Publishing replaces this digest with that
    # of the image built with this commit.
    images:
      - repository: registry.aluvian.io/aluvian-hq/notify
        digest: sha256:d33e98b1bd05c67eb6d978f96f57dd42fc9821e0ac968e053672485ff567fcb3
  action:
    # Reads the inputs on standard input, writes the outputs to standard
    # output.
    command: ["/notify"]
    deadlineSeconds: 60
    resources: {cpu: 100m, memory: 64Mi}
    inputs:
      type: object
      required: [title, body]
      properties:
        title: {type: string, maxLength: 200}
        body: {type: string, maxLength: 4000}
        severity: {type: string, enum: [info, warning, critical]}
        linkUrl: {type: string}
        linkLabel: {type: string, maxLength: 100}
        # Whom to tell: a person by user name, e-mail address or subject, a
        # position of the tenant by name (user is everyone). Naming nobody
        # tells the person who started the run.
        people: {type: array, maxItems: 50, items: {type: string}}
        positions: {type: array, maxItems: 20, items: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 63}}
    outputs:
      type: object
      properties:
        notice: {type: string}
  requires:
    platform: ">=0.5"
