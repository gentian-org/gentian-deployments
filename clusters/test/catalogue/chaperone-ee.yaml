# The chaperone: every tool call a program or an agent makes to an app of the
# tenant passes it. It verifies who asks (a present person's token from the
# tenant's realm, or a pass the notary signed), asks the platform whether that
# person may use the app, obtains the person's token for that app from the
# realm, calls the app's agent bridge and journals the call
# (services/chaperone, docs/agents.md).
#
# It holds no credential of any app. As a component that speaks for people it
# is one of the few the tenant's agent bridges admit, and the realm exchanges a
# person's token only through the client the platform made for it. A token is
# obtained for one call and kept nowhere.
#
# It comes with Voles and is not offered on its own. The chart and image
# are private packages of ghcr.io/aluvian-hq, pulled through
# registry.aluvian.io.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: chaperone-ee
  labels:
    gentianos.io/profile-name: chaperone-ee
    gentianos.io/profile-edition: ee
  annotations:
    gentianos.io/store-listed: "false"
spec:
  classes: [app]
  # Nobody opens it: programs call it.
  launch: none
  # The rights check and the token exchange are given at this tier only.
  trustTier: platform
  version: "0.1.0-main.b3e3758"
  package:
    chart:
      repository: "oci://registry.aluvian.io/aluvian-hq/charts"
      name: chaperone
      version: "0.1.0-main.b3e3758"
    valueMapping:
      database:
        hostKey: database.host
        portKey: database.port
        nameKey: database.name
        userKey: database.user
        passwordKey: database.password
      platform:
        issuerKey: auth.issuer
        tenantKey: tenant
      integrations:
        # Where the notary publishes the key passes are verified against,
        # once the tenant's administrator has granted the contract. Until
        # then an engine's calls answer 503 and a present person's pass.
        passes:
          endpointKey: notaryUrl
          # The contract's credential, with which the chaperone tells the
          # notary which tools the installed agent bridges offer.
          passwordKey: notaryKey
        # Where the liaison answers and the credential the chaperone shows
        # it: with them it tells the liaison which outside tool servers the
        # tenant's agent bridges name, and asks for a short credential when
        # it carries a call to one for a person. Until the contract is
        # granted, a call to an outside tool server is refused.
        connections:
          endpointKey: liaisonUrl
          passwordKey: liaisonKey
        # Where a run's notice is published and the credential that proves
        # the chaperone was granted the contract. Until then a run's notice
        # answers 503.
        notices:
          endpointKey: notices.url
          passwordKey: notices.key
    extraValues:
      # The Service the MCP gateway and the engines reach it at.
      fullnameOverride: chaperone
      image:
        repository: registry.aluvian.io/aluvian-hq/chaperone
      # The Secrets the platform writes for this component.
      # The platform's list of who was granted the contract tool-calls.
      callers:
        secretName: contract-callers-chaperone-ee
      rightsCheck:
        secretName: rights-check-chaperone-ee
      vouching:
        secretName: vouching-chaperone-ee
      runs:
        secretName: runs-chaperone-ee
      # The actions that may ask for a notice: notify-me tells the person
      # who started the run, notify-people whom its step names.
      notices:
        starter: [notify-me]
        named: [notify-people]
      # The agent bridges there are while the platform writes no list: Odoo's, at
      # its Service in the same namespace.
      agentBridges: '{"odoo": {"url": "http://odoo-agent-bridge:8765/mcp", "app": "odoo-base-ce"}}'
  requires:
    platform: ">=0.5"
    services:
      # The journal.
      database:
        engine: postgresql
      # May this person use this app: asked on every call.
      rights: {}
      # A present person's token is exchanged for one valid at a single app.
      # For a person who is away the chaperone vouches: it signs a statement
      # of a minute with a key it makes at start and publishes here, and the
      # realm answers with that person's token for one app. The realm
      # answers only for a person who is linked to the chaperone, and a
      # person is linked by their own yes on the notary's page.
      vouching:
        exchange: true
        keys:
          service: chaperone
          port: 8000
        consent: notary-ee
      # An action is started here and nowhere else: the chaperone holds the
      # key to the platform's dispatcher. The run's pod fetches its inputs
      # from the chaperone and delivers its outputs there, with a credential
      # made for that run.
      runs:
        callback:
          service: chaperone
          port: 8000
          path: /api/v1/action-callback
  # What the MCP gateway and the engines call: one tool call, carried and
  # journalled. A caller reaches it once the tenant's administrator has
  # granted it the contract.
  provides:
    - name: tool-calls
      protocol: http-json
      endpoint:
        service: chaperone
        port: 8000
  integrations:
    - contract: passes
      provider: notary-ee
      # What the tenant's administrator approves: one that asks for nothing
      # cannot be approved.
      capabilities: [verify]
    # A person's credential for an outside tool server is the liaison's to
    # hand out, one call at a time.
    - contract: connections
      provider: liaison
      capabilities: [credentials]
    # A run's notice goes into the desktop's inbox, and nowhere else.
    - contract: notices
      provider: desktop
      capabilities: [publish]
  secrets:
    generated:
      # What an action's secret outputs are sealed with before an engine is
      # handed them. The platform makes it once for the install and keeps it
      # across upgrades; a purge destroys it.
      - name: sealing_secret
        valuePath: sealing.secret
