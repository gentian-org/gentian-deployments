# SPDX-License-Identifier: LGPL-3.0
# ComponentProfile — Odoo Community base runtime (odoo-base-ce)
#
# Deploys one Odoo OCB instance per tenant. Module profiles (odoo-crm, …) install
# Odoo CE modules via app-odoo-base-ce Jobs in a later phase. OIDC uses app-default Client MR.
apiVersion: gentianos.io/v1alpha1
kind: ComponentProfile
metadata:
  name: odoo-base-ce
  labels:
    gentianos.io/profile-name: odoo-base-ce
    gentianos.io/profile-family: odoo
    gentianos.io/profile-edition: me
  annotations:
    # No kernel-egress-namespaces. Odoo validates tokens against the in-cluster
    # Keycloak Service (extraValues.gentian.oidc.internalIssuer), so nothing it
    # does at sign-in leaves the cluster and it has no reason to reach the
    # gateway. It briefly carried envoy-gateway-system, copied from nextcloud,
    # which did not need it either.
    gentianos.io/deployment-role: base
    gentianos.io/portal-auth-mode: oidc
spec:
  classes:
    - app
  trustTier: platform
  version: "0.5.1-dev.4"
  package:
    # The Composition that renders this chart AND the objects that have to
    # exist beside it. A chart and a composition are the one legal pair in
    # the package union: the chart is what is installed, the composition is
    # what else is created.
    composition: app-odoo-base-ce
    chart:
      repository: oci://ghcr.io/gentian-org/charts
      name: odoo
      version: "0.1.25-develop.609543e"

    valueMapping:
      oidc:
        issuerKey: "oidc.issuer"
        clientIdKey: "oidc.clientId"
        clientSecretKey: "oidc.clientSecret"
      database:
        hostKey: "database.host"
        portKey: "database.port"
        nameKey: "database.name"
        userKey: "database.user"
        passwordKey: "database.password"
      smtp:
        passwordKey: "smtp.password"
      platform:
        # Who the tenant is: written onto the company Odoo makes, once
        # (charts/odoo/files/organization.py).
        organizationKey: "organization"

    extraValues:
      fullnameOverride: odoo
      tenantId: "${TENANT_ID}"
    # No extraVolumes here: the chart defaults extra-addons to an emptyDir and
    # mounts it at modulesPath, which is exactly what the in-pod git-sync writes
    # to. This used to point the volume at the shared RWX PVC.
    #
    # The profile is not the only writer, though. On a staging-issuer cluster the
    # composition adds the kernel trust anchor to extraVolumes/extraVolumeMounts,
    # and chart <=0.1.18 read a non-empty list as "replace the addons volume" —
    # so the git-sync containers mounted a volume nobody defined and every Helm
    # upgrade failed, freezing Odoo on its last good spec. 0.1.19 defines
    # extra-addons unless an entry of that name replaces it, and appends the rest.
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2
          memory: 4Gi
      existingSecret:
        name: odoo-base-ce-sensitive-values
      ingress:
        enabled: false
      gentian:
        initModules: "base,web,gentian_os,account"
        modulesPath: /opt/odoo/custom-addons
      # Where this tenant's Odoo is actually served — the subDomain from
      # spec.ingress above. Odoo keeps this in ir_config_parameter and builds
      # its OAuth redirect_uri from it; left at Odoo's http://localhost:8069
      # default it hands the identity provider a redirect that matches none of
      # the redirectUris registered under kernelRequirements.identity, and every
      # login fails with oauth_error=3 — which on a website-enabled database
      # surfaces as a 500, because the login page itself cannot then render.
        baseUrl: "https://odoo.${TENANT_DOMAIN}"
        oidc:
        # Where the pod validates a token. The browser still goes to the public
        # issuer; only auth_oauth's server-side userinfo call moves in-cluster,
        # so signing in no longer depends on a tenant pod being able to reach
        # the kernel gateway. ${TENANT_ID} is the realm, which matches the
        # public issuer's realm segment.
          internalIssuer: "http://gentian-idp-keycloak-keycloakx-http.kernel-authentication.svc.cluster.local:8080/auth/realms/${TENANT_ID}"
      # The chart's own git-sync, running in Odoo's pod: an init container that
      # clones once before Odoo starts, and a sidecar that re-syncs on the
      # interval. Both are upstream git-sync at 999:999, writing the emptyDir
      # the chart already mounts at modulesPath, and configmap.yaml appends
      # <modulesPath>/<name>/current to addons_path.
      #
      # This replaces a standalone gentian-sidecar-git-modules Deployment that
      # wrote the same content to a ReadWriteMany PVC three pods shared. The
      # content is 2.3MB of public, reproducible git -- there is nothing to
      # share. Sharing it cost an RWX StorageClass the platform does not
      # install, and on any cluster without one the PVC stayed Pending and
      # every pod mounting it was unschedulable.
      #
      # It also removes what the split cost us: the gid 999/1000 mismatch that
      # crash-looped the clone 60 times, and the Job's five-minute wait racing
      # a clone in another pod. One pod, one fsGroup, ordered by initContainer.
        git:
          enabled: true
          repo: "https://github.com/gentian-org/odoo-modules.git"
          branch: "develop"
          syncInterval: 60

  requires:
    # The oldest platform version line this build runs on (docs/profile-bundles.md).
    platform: ">=0.5"
    services:
      identity:
        oidc:
          clientId: odoo-cb
          name: Odoo
          accessType: CONFIDENTIAL
          redirectUris:
            - "https://odoo.${TENANT_DOMAIN}/auth_oauth/signin"
        # No backchannelLogout: Odoo signs in through auth_oauth, an OAuth2
        # module rather than an OIDC relying party, so there is nothing to send a
        # logout_token to. Its session ends on its own timeout. Recorded rather
        # than left blank, so the absence reads as a limit of the app.
      database:
        engine: postgresql
        databasePerTenant: true
        allowDynamicDatabaseCreation: false
      mail:
        smtp: {}
    privileges:
      egress:
        - name: egress-1
          rule:
            to:
              - ipBlock:
                  cidr: 192.168.0.100/32
            ports:
              - protocol: TCP
                port: 9418
          reason: 'REVIEW: say what this component reaches and why'
        - name: egress-2
          rule:
            ports:
              - protocol: TCP
                port: 443

  # No sidecars. git-modules used to be declared here as a standalone
  # Deployment with its own ReadWriteMany PVC; it is now two containers inside
  # Odoo's own pod, configured by extraValues.gentian.git above.
          reason: 'REVIEW: say what this component reaches and why'
  provides:
    - name: erp-core
      protocol: http-json


  integrations:
    - contract: file-store
      provider: nextcloud
      capabilities: [webdav:read, webdav:write]
    - contract: central-navigation
      provider: portal
      capabilities: [navigation:register]

  secrets:
    generated:
      - name: admin_password
        valuePath: "odoo.adminPassword"

  # How this app is put back. The default capture (scale to zero, dump the
  # database, archive the data volume) is right for Odoo; only the restore
  # adds to it.
  backup:
    quiesce:
      # Where the commands below run: the pod's other containers are git-sync.
      container: odoo
    restore:
      # What the restored data remembers of where it ran. The database
      # credentials, web.base.url and the sign-in provider need nothing: the
      # chart and gentian_os set them again on every start from this pod's
      # values. The data volume names the database (filestore/<database>), and
      # the database names the old domain wherever else an address is kept.
      # Idempotent; skips what a bundle that does not say where it was written
      # (GENTIAN_RESTORE_SOURCE_* empty) cannot tell it. Odoo is resumed before
      # these run, so they wait for its start-up to finish.
      post:
        - - sh
          - -c
          - |
            set -eu
            say() { echo "gentian-restore: $*"; }
            data=$(sed -n 's/^[[:space:]]*data_dir[[:space:]]*=[[:space:]]*//p' /etc/odoo/odoo.conf | tail -n 1)
            data=${data:-/opt/odoo/data}

            # Odoo keeps a database's files in filestore/<database>. Restored under
            # another name, they are moved to that name's folder. Odoo may already have
            # written files there on starting; theirs are named by their content, so one
            # already there is the same file.
            for pair in ${GENTIAN_RESTORE_DATABASES:-}; do
              from=${pair%%=*}
              to=${pair#*=}
              if [ -z "$from" ] || [ -z "$to" ] || [ "$from" = "$to" ] || [ ! -d "$data/filestore/$from" ]; then
                continue
              fi
              if [ ! -e "$data/filestore/$to" ]; then
                mv "$data/filestore/$from" "$data/filestore/$to"
              else
                for dir in "$data/filestore/$from"/*/; do
                  [ -d "$dir" ] || continue
                  name=$(basename "$dir")
                  mkdir -p "$data/filestore/$to/$name"
                  for file in "$dir"*; do
                    [ -f "$file" ] || continue
                    if [ -e "$data/filestore/$to/$name/$(basename "$file")" ]; then
                      rm -f "$file"
                    else
                      mv "$file" "$data/filestore/$to/$name/"
                    fi
                  done
                  rmdir "$dir" 2>/dev/null || true
                done
                rmdir "$data/filestore/$from" 2>/dev/null \
                  || say "left in $data/filestore/$from: what is not a stored file"
              fi
              say "filestore of $from is now the filestore of $to"
            done

            # Addresses on the old domain. web.base.url and the sign-in provider are set
            # again on every start from this pod's values; what else names the old
            # domain is rewritten here.
            src=${GENTIAN_RESTORE_SOURCE_DOMAIN:-}
            dst=${GENTIAN_RESTORE_TARGET_DOMAIN:-}
            if [ -z "$src" ] || [ -z "$dst" ] || [ "$src" = "$dst" ]; then
              exit 0
            fi
            # After the start's own module update, so the two do not write at once.
            i=0
            until curl -fs -o /dev/null --max-time 5 http://127.0.0.1:8069/web/health; do
              i=$((i + 1))
              if [ "$i" -ge 120 ]; then
                say "Odoo does not answer yet; rewriting addresses anyway"
                break
              fi
              sleep 5
            done
            PGPASSWORD="$DB_PASSWORD" python3 /opt/odoo/src/odoo/odoo-bin shell \
              -d "$DB_NAME" --db_host="$DB_HOST" --db_port="$DB_PORT" --db_user="$DB_USER" \
              --config=/etc/odoo/odoo.conf --no-http --shell-interface=python \
              --log-level=warn <<'PY'
            import os, re
            src = os.environ["GENTIAN_RESTORE_SOURCE_DOMAIN"].strip().lower()
            dst = os.environ["GENTIAN_RESTORE_TARGET_DOMAIN"].strip().lower()
            q = re.escape(src)
            url = re.compile(r"(https?://)((?:[a-z0-9-]+\.)*)" + q + r"(?![a-z0-9-]|\.[a-z0-9])", re.I)
            host = re.compile(r"^((?:[a-z0-9-]+\.)*)" + q + r"(:\d+)?$", re.I)

            def rehost(value):
                if not isinstance(value, str):
                    return value
                m = host.match(value)
                if m:
                    return m.group(1) + dst + (m.group(2) or "")
                return url.sub(lambda m: m.group(1) + m.group(2) + dst, value)

            changed = []
            for model, fields in (
                ("ir.config_parameter", ("value",)),
                ("auth.oauth.provider", ("auth_endpoint", "validation_endpoint", "data_endpoint")),
                ("mail.alias.domain", ("name",)),
                ("website", ("domain",)),
            ):
                if model not in env:
                    continue
                for rec in env[model].sudo().with_context(active_test=False).search([]):
                    vals = {f: rehost(rec[f]) for f in fields if f in rec._fields and rec[f] and rehost(rec[f]) != rec[f]}
                    if vals:
                        rec.write(vals)
                        changed.append("%s %s" % (model, rec.key if model == "ir.config_parameter" else rec.id))
            env.cr.commit()
            env.registry.clear_all_caches()
            env.registry.signal_changes()
            for c in changed:
                print("gentian-restore: %s now names %s" % (c, dst))
            PY

  expose:
    # Odoo's SSO callback exceeds Envoy's 15s default route timeout, so the
    # sign-in that gets a user into the app is the request that gets cut:
    #
    #   504  UT  15000ms  /auth_oauth/signin?state=...
    #
    # /auth_oauth/signin is where Odoo takes the Keycloak callback, links or
    # creates the user, and loads the web client for the first time -- which
    # compiles the JS/CSS asset bundles. That is minutes of work on a small
    # node, once, and every unauthenticated path is served in well under a
    # second. A default meant for ordinary requests is simply the wrong budget
    # for it.
    #
    # nextcloud already declares the same annotations for the same reason. 600s
    # rather than its 3600s: nothing here is a multi-hour upload, and a hung
    # backend should still surface within ten minutes rather than hold the
    # connection for an hour.
    - name: web
      surface: gateway
      authMode: oidc
      subDomain: odoo
      backend:
        service: odoo
        port: 8069
      tile:
        displayName: "Odoo Settings"
        displayNames:
          de_DE: "Odoo Einstellungen"
        logo: data:image/png;base64,
        image: assets/tile.png
        path: /odoo/action-base_setup.action_general_configuration?gentian_embed=1
        relation: can_launch
  customization:
    grade: A
    rubricScore: 8
    supportedRungs: [L0, L1, L3, L4, L5, L6]   # L2 is always available, never listed
    ladderDocs: https://github.com/gentian-org/gentian-apps/blob/main/profiles/odoo/odoo-base-ce/customization.md

    configure:
      valuesSchema: charts/odoo/values.schema.json
      hotReload: false

    dropIns:
      - name: odoo-conf
        path: /etc/odoo-conf-fragments
        format: ini
        source: configMap
        maxBytes: 262144
        # Odoo has no native conf.d — this is a Gentian-built mechanism (an init
        # container merges fragments into odoo.conf before start), not an upstream
        # promise about the path. See charts/odoo/templates/deployment.yaml.
        upstreamDocumented: false
        tenantEditable: false
      - name: branding
        path: /opt/odoo/custom-branding
        format: files
        source: configMap
        upstreamDocumented: false
        tenantEditable: true
        maxBytes: 262144

    extension:
      mechanism: odoo-addon
      delivery: [git-sidecar, addon-profile, image-layer]
      registry: https://github.com/gentian-org/odoo-modules
      addonPath: /opt/odoo/custom-addons
      apiStability: stable
      apiDocs: https://www.odoo.com/documentation/18.0/developer.html
      perTenantAddons: true      # one Odoo per tenant namespace — see framework §2.4
      testMatrix: ["18.0"]

    publishes:
      apis:
        - contract: erp-core
          protocol: http-json
          spec: openapi
          path: /api
          auth: oidc-token-exchange

    repackage:
      chartOwnership: gentian-owned
      compositionRef: app-odoo-base-ce

    patch:
      allowed: true
      buildRepo: https://github.com/gentian-org/ocb
      seriesPath: patches/series
      requiresApproval: platform-team

    fork:
      allowed: true
      repo: https://github.com/gentian-org/ocb
      # OCA/OCB, not odoo/odoo: ocb's Dockerfile clones OCA/OCB branch 19.0 and
      # strips Enterprise references from it. OCB is itself a community fork of
      # odoo/odoo, so naming the grand-upstream here pointed CVE watch and the
      # upstream-first check at a tree this fork does not track.
      upstream: https://github.com/OCA/OCB
      owner: platform-erp
      cveWatch: true
  launch: tile
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-odoo-base-ce
  labels:
    gentianos.io/profile-name: odoo-base-ce
spec:
  compositeTypeRef:
    apiVersion: gentianos.io/v1alpha1
    kind: XApp
  mode: Pipeline
  pipeline:

    # ── Step 1: Fetch the AppProfile + kernel service ConfigMap ──────────────
    - step: fetch-extra-resources
      functionRef:
        name: function-extra-resources
      input:
        apiVersion: extra-resources.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          extraResources:
            - kind: ComponentProfile
              into: componentProfile
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 1
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name
            - kind: ConfigMap
              into: kernelServices
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: kernel-services
            - kind: ConfigMap
              into: clusterConfig
              apiVersion: v1
              type: Selector
              selector:
                maxMatch: 1
                matchLabels:
                  - key: gentianos.io/config-type
                    type: Value
                    value: cluster-config
            - kind: OIDCPackCatalog
              into: oidcPackCatalog
              apiVersion: gentianos.io/v1alpha1
              type: Selector
              selector:
                maxMatch: 1
                minMatch: 0
                matchLabels:
                  - key: gentianos.io/profile-name
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.profileRef.name

    # ── Step 2: Render composed resources ─────────────────────────────────────
    - step: render-app-core
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr     := .observed.composite.resource }}
            {{- $spec   := $xr.spec }}
            {{- $xrName := $xr.metadata.name }}
            {{- $app    := $spec.claimRef.name }}
            {{- $ns     := $spec.tenantNamespace }}
            {{- $tenant := trimPrefix "tenant-" $ns }}
            {{- $domain := default (printf "%s.example.org" $tenant) $spec.domain }}

            {{- /* ── Load AppProfile from pipeline context ────────────────────── */}}
            {{- $extraRes  := index .context "apiextensions.crossplane.io/extra-resources" }}
            {{- $profiles  := dig "componentProfile" list $extraRes }}
            {{- if eq (len $profiles) 0 }}
              {{- fail (printf "ComponentProfile %q not found in cluster" $spec.profileRef.name) }}
            {{- end }}
            {{- $profile   := index $profiles 0 }}
            {{- $pSpec     := dig "spec" dict $profile }}
            {{- $package   := dig "package" dict $pSpec }}
            {{- $vm        := dig "valueMapping" dict $package }}
            {{- $appSecrets := dig "secrets" "generated" list $pSpec }}
            {{- $chart     := dig "chart" nil $package }}
            {{- $role      := default "standalone" (dig "metadata" "annotations" "gentianos.io/deployment-role" "" $profile) }}

            {{- $kr := dig "requires" "services" dict $pSpec }}

            {{- /* ── Load cluster-config ConfigMap ──────────────────────────────── */}}
            {{- $ccRes      := dig "clusterConfig" list $extraRes }}
            {{- $ccCM       := default dict (index $ccRes 0) }}
            {{- $ccData     := dig "data" dict $ccCM }}
            {{- /* The namespace Crossplane and its providers run in, taken from
                 where the cluster composition put gentian-cluster-config: v4
                 named crossplane-system here, which a v5 cluster does not have. */}}
            {{- $provNs     := dig "metadata" "namespace" "kernel-provisioning" $ccCM }}
            {{- $nodeIP        := dig "node.ip"        "" $ccData }}

            {{- /* OIDC pack scopes from the profile's OIDCPackCatalog CR. */}}
            {{- $oidcPackDefaultScopes := dict }}
            {{- $oidcPackFullScopeAllowed := dict }}
            {{- $catalogRes := dig "oidcPackCatalog" list $extraRes }}
            {{- if gt (len $catalogRes) 0 }}
            {{- $catSpec := dig "spec" dict (index $catalogRes 0) }}
            {{- $catPacks := default dict $catSpec.packs }}
            {{- range $clientId, $pack := $catPacks }}
            {{- $scopes := default list $pack.defaultScopes }}
            {{- if $pack.scopeName }}
            {{- $scopes = append $scopes $pack.scopeName }}
            {{- end }}
            {{- $_ := set $oidcPackDefaultScopes $clientId $scopes }}
            {{- $_ := set $oidcPackFullScopeAllowed $clientId (default false $pack.fullScopeAllowed) }}
            {{- end }}
            {{- end }}

            {{- if eq $role "base" }}

            {{- /* ── Build ExternalSecret data[] entries ───────────────────────── */}}
            {{- $esData := list }}

            {{- /* OIDC */}}
            {{- if $vm.oidc }}
            {{- $oidcPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            {{- if $vm.oidc.issuerKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-issuer"        "remoteRef" (dict "key" $oidcPath "property" "issuer")) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-id"     "remoteRef" (dict "key" $oidcPath "property" "client-id")) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $csPath := default $oidcPath $vm.oidc.clientSecretOpenbaoPath }}
            {{- $csProp := default "client-secret" $vm.oidc.clientSecretOpenbaoProperty }}
            {{- $esData = append $esData (dict "secretKey" "oidc-client-secret" "remoteRef" (dict "key" $csPath "property" $csProp)) }}
            {{- end }}
            {{- end }}

            {{- /* Database */}}
            {{- if $vm.database }}
            {{- $dbPath := printf "gentian-os/tenants/%s/apps/%s/database" $tenant $app }}
            {{- if $vm.database.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "db-host"     "remoteRef" (dict "key" $dbPath "property" "host")) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $esData = append $esData (dict "secretKey" "db-port"     "remoteRef" (dict "key" $dbPath "property" "port")) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $esData = append $esData (dict "secretKey" "db-name"     "remoteRef" (dict "key" $dbPath "property" "name")) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $esData = append $esData (dict "secretKey" "db-user"     "remoteRef" (dict "key" $dbPath "property" "user")) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "db-password" "remoteRef" (dict "key" $dbPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* SMTP */}}
            {{- if $vm.smtp }}
            {{- $smtpPath := printf "gentian-os/tenants/%s/apps/%s/smtp" $tenant $app }}
            {{- if $vm.smtp.hostKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-host"     "remoteRef" (dict "key" $smtpPath "property" "host")) }}
            {{- end }}
            {{- if $vm.smtp.portKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-port"     "remoteRef" (dict "key" $smtpPath "property" "port")) }}
            {{- end }}
            {{- if $vm.smtp.userKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-user"     "remoteRef" (dict "key" $smtpPath "property" "user")) }}
            {{- end }}
            {{- if $vm.smtp.passwordKey }}
            {{- $esData = append $esData (dict "secretKey" "smtp-password" "remoteRef" (dict "key" $smtpPath "property" "password")) }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets (AppProfile.spec.appSecrets) */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $internalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $esData = append $esData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $internalPath "property" "value")) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit OpenBao KV seeders for each app-internal secret ──────── */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $safeName := $s.name | replace "_" "-" }}
            {{- $seedName := printf "%s-%s-seed" $xrName $safeName }}
            {{- $kvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $app $s.name }}
            {{- $seedVal  := sha256sum (printf "%s:%s:%s" $xrName $app $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-seed-secret
              name: {{ $seedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $seedName }}
                    namespace: {{ $provNs }}
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $seedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $safeName }}-kv
                # Identify this resource by its KV path, not by the install that
                # created it: without an external-name the provider sees no
                # existing resource and Creates, overwriting a secret the app's
                # database is still hashed against. Mirrors app-default.
                crossplane.io/external-name: secret/data/{{ $kvPath }}
              name: {{ $seedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $kvPath }}
                dataJsonSecretRef:
                  name: {{ $seedName }}
                  namespace: {{ $provNs }}
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- /* ── Build Release set[] entries ────────────────────────────────── */}}
            {{- $secretName := printf "%s-sensitive-values" $app }}
            {{- $relSet := list }}

            {{- if $vm.oidc }}
            {{- if $vm.oidc.issuerKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.issuerKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-issuer"))) }}
            {{- end }}
            {{- if $vm.oidc.clientIdKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientIdKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-id"))) }}
            {{- end }}
            {{- if $vm.oidc.clientSecretKey }}
            {{- $relSet = append $relSet (dict "name" $vm.oidc.clientSecretKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "oidc-client-secret"))) }}
            {{- end }}
            {{- end }}

            {{- if $vm.database }}
            {{- if $vm.database.hostKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.hostKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-host"))) }}
            {{- end }}
            {{- if $vm.database.portKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.portKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-port"))) }}
            {{- end }}
            {{- if $vm.database.nameKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.nameKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-name"))) }}
            {{- end }}
            {{- if $vm.database.userKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.userKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-user"))) }}
            {{- end }}
            {{- if $vm.database.passwordKey }}
            {{- $relSet = append $relSet (dict "name" $vm.database.passwordKey
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" "db-password"))) }}
            {{- end }}
            {{- end }}

            {{- /* Mail is optional: a cluster without the relay's credentials
                   leaves them empty, and provider-helm refuses an empty --set
                   value, which would keep the whole app from installing. So
                   the SMTP values do not go through set. The ExternalSecret
                   writes each one, when it is not empty, as a values document
                   of its own (values-smtp-*), and the Release reads those as
                   optional valuesFrom: an empty credential is simply not set,
                   the app installs and sends no mail, and the value reaches
                   it on the next sync once it exists. Mirrors app-default. */}}
            {{- $relValuesFrom := list }}
            {{- $esTemplate := dict }}
            {{- if $vm.smtp }}
            {{- $optional := list
                (dict "path" $vm.smtp.hostKey "key" "smtp-host" "raw" false)
                (dict "path" $vm.smtp.portKey "key" "smtp-port" "raw" true)
                (dict "path" $vm.smtp.userKey "key" "smtp-user" "raw" false)
                (dict "path" $vm.smtp.passwordKey "key" "smtp-password" "raw" false) }}
            {{- range $o := $optional }}
            {{- if $o.path }}
            {{- $head := "" }}
            {{- $tail := "" }}
            {{- range $part := splitList "." $o.path }}
            {{- $head = printf "%s{%s:" $head (toJson $part) }}
            {{- $tail = printf "%s}" $tail }}
            {{- end }}
            {{- $value := ternary " . " " . | toJson " $o.raw }}
            {{- $docKey := printf "values-%s" $o.key }}
            {{- $esTemplate = set $esTemplate $docKey (printf "%s with index . %q %s%s%s%s%s%s%s end %s" "{{" $o.key "}}" $head "{{" $value "}}" $tail "{{" "}}") }}
            {{- $relValuesFrom = append $relValuesFrom (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" $docKey "optional" true)) }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* App-internal secrets */}}
            {{- range $s := $appSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $relSet = append $relSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $secretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- /* ── Render inline non-sensitive values ───────────────────────── */}}
            {{- $extraVals := dict }}
            {{- $ksRes := dig "kernelServices" list $extraRes }}
            {{- $ksCM  := default dict (index $ksRes 0) }}
            {{- $ksCMData := dig "data" dict $ksCM }}
            {{- if $package.extraValues }}
            {{- $kernelDomain := dig "KERNEL_DOMAIN" "" $ksCMData }}
            {{- /* No SMTP host is substituted, and none should be: mail.smtpHost
            is spec.mail.host, the smarthost Postfix relays THROUGH, and no app
            is given the credential to authenticate there. An app that needs to
            send mail declares it and receives a credential. See
            app-default.yaml. */}}
            {{- $raw := $package.extraValues | toJson }}
            {{- $raw = $raw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $raw = $raw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $raw = $raw | replace "${TENANT_ID}"        $tenant }}
            {{- if $kernelDomain }}{{ $raw = $raw | replace "${KERNEL_DOMAIN}" $kernelDomain }}{{ end }}
            {{- if $nodeIP      }}{{ $raw = $raw | replace "${NODE_IP}"       $nodeIP      }}{{ end }}
            {{- $extraVals = $raw | fromJson }}
            {{- end }}
            {{- if and $spec.config $spec.config.extraValues }}
            {{- $extraVals = mergeOverwrite $extraVals $spec.config.extraValues }}
            {{- end }}
            {{- if and $spec.config $spec.config.replicas }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "replicaCount" $spec.config.replicas) }}
            {{- end }}
            {{- $podLabels := default dict (dig "podLabels" dict $extraVals) }}
            {{- $podLabels = mergeOverwrite $podLabels (dict "gentianos.io/app" $app "gentianos.io/tenant" $tenant) }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "podLabels" $podLabels) }}

            {{- $rawImagePull := dig "imagePullSecrets" list $extraVals }}
            {{- $imagePull := list }}
            {{- range $entry := $rawImagePull }}
            {{- if kindIs "string" $entry }}
            {{- $imagePull = append $imagePull $entry }}
            {{- else if kindIs "map" $entry }}
            {{- $pullName := dig "name" "" $entry }}
            {{- if $pullName }}{{- $imagePull = append $imagePull $pullName }}{{- end }}
            {{- end }}
            {{- end }}
            {{- if eq (len $imagePull) 0 }}
            {{- $imagePull = list "registry-credentials" }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "imagePullSecrets" $imagePull
                "global" (mergeOverwrite (dig "global" dict $extraVals) (dict "imagePullSecrets" $imagePull))
            ) }}

            {{- $acmeStaging := eq (dig "ACME_STAGING" "false" $ksCMData) "true" }}
            {{- if $acmeStaging }}
            {{- $krStaging := dig "requires" "services" dict $pSpec }}
            {{- $identityStaging := default dict $krStaging.identity }}
            {{- $oidcStaging := default dict $identityStaging.oidc }}
            {{- $stagingVol := dict
                "name" "kernel-trust-anchor"
                "secret" (dict "secretName" "gentian-trust-anchor-tls")
            }}
            {{- $stagingMounts := list
                (dict "name" "kernel-trust-anchor" "mountPath" "/opt/gentian-trust-anchor" "readOnly" true)
            }}
            {{- $stagingEnv := list
                (dict "name" "REQUESTS_CA_BUNDLE" "value" "/opt/gentian-trust-anchor/ca.crt")
                (dict "name" "SSL_CERT_FILE" "value" "/opt/gentian-trust-anchor/ca.crt")
                (dict "name" "DENO_CERT" "value" "/opt/gentian-trust-anchor/ca.crt")
            }}
            {{- $stagingEnvironment := dict
                "REQUESTS_CA_BUNDLE" "/opt/gentian-trust-anchor/ca.crt"
                "SSL_CERT_FILE" "/opt/gentian-trust-anchor/ca.crt"
                "DENO_CERT" "/opt/gentian-trust-anchor/ca.crt"
            }}
            {{- $existingEnvironment := default dict (dig "environment" dict $extraVals) }}
            {{- $stagingJavaOpts := list
                "-Djavax.net.ssl.trustStore=/opt/gentian-trust-anchor/truststore.jks"
                "-Djavax.net.ssl.trustStoreType=JKS"
                "-Djavax.net.ssl.trustStorePassword=changeit"
            }}
            {{- $existingJavaOpts := default list (dig "javaOpts" list $extraVals) }}
            {{- $needsJavaTrust := or (gt (len $existingJavaOpts) 0) $oidcStaging.clientId }}
            {{- if $needsJavaTrust }}
            {{- range $opt := $stagingJavaOpts }}
            {{- if not (has $opt $existingJavaOpts) }}
            {{- $existingJavaOpts = append $existingJavaOpts $opt }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $extraVals = mergeOverwrite $extraVals (dict
                "extraEnvVars" (concat (default list (dig "extraEnvVars" list $extraVals)) $stagingEnv)
                "environment" (mergeOverwrite $existingEnvironment $stagingEnvironment)
                "extraVolumes" (concat (default list (dig "extraVolumes" list $extraVals)) (list $stagingVol))
                "extraVolumeMounts" (concat (default list (dig "extraVolumeMounts" list $extraVals)) $stagingMounts)
            ) }}
            {{- if $needsJavaTrust }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "javaOpts" $existingJavaOpts) }}
            {{- end }}
            {{- end }}

            {{- /* ── Emit Keycloak Client CR ──────────────────────────────────── */}}
            {{- $kr       := dig "requires" "services" dict $pSpec }}
            {{- $identity := default dict $kr.identity }}
            {{- $oidcCl   := default dict $identity.oidc }}
            {{- if $oidcCl.clientId }}
            {{- $oidcPackKey := default $oidcCl.clientId $oidcCl.oidcPackRef }}
            {{- $redirects  := list }}
            {{- range $uri := (default list $oidcCl.redirectUris) }}
            {{- $redirects = append $redirects ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- $postLogout := list }}
            {{- range $uri := (default list $oidcCl.postLogoutRedirectUris) }}
            {{- $postLogout = append $postLogout ($uri | replace "${TENANT_DOMAIN}" $domain) }}
            {{- end }}
            {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
            {{- $oidcCredsPath := printf "gentian-os/tenants/%s/apps/%s/oidc" $tenant $app }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-oidc-client-creds-es
              name: {{ $xrName }}-oidc-client-creds-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $xrName }}-oidc-client-creds
                    namespace: {{ $provNs }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao
                    target:
                      name: {{ $xrName }}-oidc-client-creds
                      creationPolicy: Owner
                    data:
                      - secretKey: client-secret
                        remoteRef:
                          key: {{ $oidcCredsPath }}
                          property: client-secret
              providerConfigRef:
                name: kubernetes
            {{- end }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: Client
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-client
              name: {{ $tenant }}-{{ $app }}-keycloak-client
            spec:
              deletionPolicy: Delete
              forProvider:
                clientId: {{ $oidcCl.clientId | quote }}
                name: {{ default $oidcCl.clientId $oidcCl.name | quote }}
                realmId: {{ $tenant }}
                accessType: {{ default "PUBLIC" $oidcCl.accessType | quote }}
                standardFlowEnabled: true
                implicitFlowEnabled: true
                directAccessGrantsEnabled: {{ default false $oidcCl.directAccessGrantsEnabled }}
                serviceAccountsEnabled: false
                {{- if hasKey $oidcPackFullScopeAllowed $oidcPackKey }}
                fullScopeAllowed: {{ index $oidcPackFullScopeAllowed $oidcPackKey }}
                {{- end }}
                {{- if $redirects }}
                validRedirectUris:
                  {{ toYaml $redirects | nindent 18 }}
                {{- end }}
                webOrigins:
                  - "+"
                {{- if $postLogout }}
                validPostLogoutRedirectUris:
                  {{ toYaml $postLogout | nindent 18 }}
                {{- end }}
                {{- if eq (default "PUBLIC" $oidcCl.accessType) "CONFIDENTIAL" }}
                clientSecretSecretRef:
                  name: {{ $xrName }}-oidc-client-creds
                  namespace: {{ $provNs }}
                  key: client-secret
                {{- end }}
              providerConfigRef:
                name: keycloak
            {{- if hasKey $oidcPackDefaultScopes $oidcPackKey }}
            ---
            apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
            kind: ClientDefaultScopes
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-keycloak-default-scopes
              name: {{ $tenant }}-{{ $app }}-keycloak-default-scopes
            spec:
              deletionPolicy: Orphan
              forProvider:
                realmId: {{ $tenant }}
                clientIdRef:
                  name: {{ $tenant }}-{{ $app }}-keycloak-client
                defaultScopes:
                  {{ toYaml (index $oidcPackDefaultScopes $oidcPackKey) | nindent 18 }}
              providerConfigRef:
                name: keycloak
            {{- end }}
            {{- end }}

            {{- /* ── Emit ExternalSecret ── */}}
            {{- if gt (len $esData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-externalsecret
              name: {{ $xrName }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $secretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    {{- /* The tenant's own store: the kernel's is not usable
                         from a tenant's namespace. */}}
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao-tenant-{{ $tenant }}
                    target:
                      name: {{ $secretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                      {{- if gt (len $esTemplate) 0 }}
                      template:
                        engineVersion: v2
                        mergePolicy: Merge
                        data:
                          {{ toYaml $esTemplate | nindent 26 }}
                      {{- end }}
                    data:
                      {{ toYaml $esData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Retry a failed release by upgrading it ───────────────────────
                   A release that failed -- a first boot that outran waitTimeout,
                   a module clone that could not be fetched yet -- is never tried
                   again on its own. provider-helm counts a failed release with an
                   unchanged spec as up to date, so without rollbackLimit it never
                   calls Update; and rollbackLimit is not an option, because at
                   revision 1 its retry is an uninstall that takes odoo-data with
                   it (see the Release below). The workload recovers and the
                   Release stays failed forever, and so does the App.

                   So the desired values change when the observed release has
                   failed: retryAfterRevision names the revision that failed. The
                   release is then out of date, provider-helm runs Upgrade, and
                   Helm upgrades a failed release in place -- volumes kept. Should
                   that attempt fail too, its own revision is the next value, so
                   each failure earns exactly one more attempt, each bounded by
                   waitTimeout.

                   The value is carried forward from the observed Release once the
                   release deploys, not dropped: dropping it would change the
                   values again and cost a pointless upgrade on every recovery.
                   The chart does not read it; its schema allows extra keys. */}}
            {{- $observedRelease := dig "resources" (printf "%s-release" $app) "resource" dict $.observed }}
            {{- $retryAfter := dig "spec" "forProvider" "values" "gentianRelease" "retryAfterRevision" 0 $observedRelease | int }}
            {{- if eq (dig "status" "atProvider" "state" "" $observedRelease) "failed" }}
            {{- $retryAfter = dig "status" "atProvider" "revision" 0 $observedRelease | int }}
            {{- end }}
            {{- if gt $retryAfter 0 }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "gentianRelease" (dict "retryAfterRevision" $retryAfter)) }}
            {{- end }}

            {{- /* ── Which add-on set is installed ─────────────────────────────
                   The add-ons Job below runs once per selection. What says it
                   has run is kept where retryAfterRevision is, in the Release's
                   values (the chart does not read it): the hash of the
                   selection whose Job succeeded, carried forward from the
                   observed Release and set when the observed Job reports
                   success. Once it names the current selection the Job is no
                   longer composed, and nothing creates it again when its ttl
                   removes it. */}}
            {{- $addons := concat (list "gentian_os") (dig "addons" list $spec) }}
            {{- $addonList := join "," $addons }}
            {{- $addonHash := substr 0 10 (sha256sum $addonList) }}
            {{- $addonKey := printf "%s-addons-job-%s" $app $addonHash }}
            {{- $observedAddons := dig "resources" $addonKey "resource" dict $.observed }}
            {{- $addonsInstalled := dig "spec" "forProvider" "values" "gentianRelease" "addonsInstalled" "" $observedRelease }}
            {{- if gt (dig "status" "atProvider" "manifest" "status" "succeeded" 0 $observedAddons | int) 0 }}
            {{- $addonsInstalled = $addonHash }}
            {{- end }}
            {{- if $addonsInstalled }}
            {{- $extraVals = mergeOverwrite $extraVals (dict "gentianRelease" (dict "addonsInstalled" $addonsInstalled)) }}
            {{- end }}
            {{- $baseReady := false }}
            {{- range $c := (dig "status" "conditions" list $observedRelease) }}
            {{- if and (eq (dig "type" "" $c) "Ready") (eq (dig "status" "" $c) "True") }}
            {{- $baseReady = true }}
            {{- end }}
            {{- end }}

            {{- $extraVals = $extraVals | toJson | fromJson }}

            {{- /* ── Emit Helm Release ────────────────────────────────────────── */}}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-release
              name: {{ $xrName }}-release
            spec:
              # No rollbackLimit, deliberately. provider-helm's shouldRollBack
              # fires on StatusPendingInstall as readily as on StatusFailed, and
              # at revision 1 there is nothing to roll back to, so what it does
              # is uninstall -- taking odoo-data with it. Odoo's first boot
              # installs modules and can outrun waitTimeout on slow storage while
              # working perfectly well, which turned a slow install into three
              # rounds of deleting the tenant's filestore and starting over. A
              # failed release is retried by upgrading it instead -- see the
              # retryAfterRevision block above.
              forProvider:
                chart:
                  repository: {{ $chart.repository }}
                  name: {{ $chart.name }}
                  version: {{ $chart.version | quote }}
                namespace: {{ $ns }}
                # Wait for the release's workloads, not just for Helm to have
                # applied the manifests.
                #
                # With wait: false the Release goes Ready the moment the objects
                # exist, so an App whose pods can never schedule still reports
                # Ready=True -- and function-auto-ready then marks the XR Ready,
                # and the Tenant says "All App claims are Ready". Odoo sat like
                # that for hours: its modules PVC asked for a StorageClass the
                # cluster does not have, three pods were Pending the whole time,
                # and every signal above them was green.
                #
                # The kernel's own releases (infra-data, suze) have always waited.
                # Apps are what a tenant actually sees, so a false green matters
                # more here, not less.
                #
                # 10m rather than infra-data's 5m: an app's first boot can include
                # schema migration or module installation. On timeout the Release
                # reports not-ready and says so, which is the outcome being asked
                # for -- a wrong answer arriving quickly is worse than a right one
                # arriving late.
                wait: true
                waitTimeout: "10m"
                skipCRDs: true
                # The tenant's namespace exists, and the account the release
                # is installed as may not create one.
                skipCreateNamespace: true
                {{- if gt (len $extraVals) 0 }}
                values:
                  {{ toYaml $extraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $relValuesFrom) 0 }}
                valuesFrom:
                  {{ toYaml $relValuesFrom | nindent 18 }}
                {{- end }}
                {{- if gt (len $relSet) 0 }}
                set:
                  {{ toYaml $relSet | nindent 18 }}
                {{- end }}
              # A tenant's chart is installed as the narrow account, not as the
              # kernel's cluster-admin one (gentian-os provider-configs.yaml).
              providerConfigRef:
                name: tenant-apps

            {{- /* ── Emit stable service alias ─────────────────────────────────── */}}
            {{- /* AppProfile had one spec.ingress with serviceName and servicePort;
                 ComponentProfile has a list of exposures, each naming the Service
                 it routes to. The gateway entry is the one that needs an alias:
                 it is the one the edge resolves by name. The FIRST, because the
                 alias is one Service and a profile publishing several entries on
                 one backend names the same one. */}}
            {{- $backend := dict }}
            {{- range $e := (dig "expose" list $pSpec) }}
              {{- if and (eq (dig "surface" "" $e) "gateway") (not $backend.service) }}
                {{- $backend = dig "backend" dict $e }}
              {{- end }}
            {{- end }}
            {{- $stableSvcName  := dig "service" "" $backend }}
            {{- $fullnameOverride := dig "fullnameOverride" "" $extraVals }}
            {{- if and $stableSvcName (ne $stableSvcName $fullnameOverride) }}
            {{- $component := trimPrefix (printf "%s-" $app) $stableSvcName }}
            {{- $svcPort   := default 80 (dig "port" 0 $backend | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-stable-svc
              name: {{ $xrName }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $stableSvcName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $xrName }}-release
                      app.kubernetes.io/component: {{ $component }}
                    ports:
                    - name: http
                      port: {{ $svcPort }}
                      targetPort: {{ $svcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- /* ── Emit sidecars (AppProfile.spec.sidecars) ────────────────────── */}}
            {{- $sidecars := dig "extensions" list $pSpec }}
            {{- range $sc := $sidecars }}
            {{- if and $sc.name $sc.chart.name }}
            {{- $scKey := printf "%s-%s" $app $sc.name }}
            {{- $scAppSecrets := default list $sc.appSecrets }}
            {{- $scSecretName := printf "%s-sensitive-values" $scKey }}
            {{- $scEsData := list }}
            {{- $scRelSet := list }}
            {{- range $s := $scAppSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $scInternalPath := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $scKey $s.name }}
            {{- $scEsData = append $scEsData (dict "secretKey" (printf "internal-%s" $s.name)
                "remoteRef" (dict "key" $scInternalPath "property" "value")) }}
            {{- $scRelSet = append $scRelSet (dict "name" $s.valuePath
                "valueFrom" (dict "secretKeyRef" (dict "name" $scSecretName "namespace" $ns "key" (printf "internal-%s" $s.name)))) }}
            {{- end }}
            {{- end }}

            {{- /* OpenBao KV seeders for each sidecar appSecret */}}
            {{- range $s := $scAppSecrets }}
            {{- if and $s.name $s.valuePath }}
            {{- $scSafeName := $s.name | replace "_" "-" }}
            {{- $scSeedName := printf "%s-%s-%s-seed" $xrName $sc.name $scSafeName }}
            {{- $scKvPath   := printf "gentian-os/tenants/%s/apps/%s/internal/%s" $tenant $scKey $s.name }}
            {{- $scSeedVal  := sha256sum (printf "%s:%s:%s" $xrName $scKey $s.name) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-{{ $scSafeName }}-seed-secret
              name: {{ $scSeedName }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ $scSeedName }}
                    namespace: {{ $provNs }}
                  type: Opaque
                  stringData:
                    data.json: '{"value":"{{ $scSeedVal }}"}'
              providerConfigRef:
                name: kubernetes
            ---
            apiVersion: kv.vault.upbound.io/v1alpha1
            kind: SecretV2
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-{{ $scSafeName }}-kv
                # Identify this resource by its KV path, not by the install that
                # created it: without an external-name the provider sees no
                # existing resource and Creates, overwriting a secret the app's
                # database is still hashed against. Mirrors app-default.
                crossplane.io/external-name: secret/data/{{ $scKvPath }}
              name: {{ $scSeedName }}-kv
            spec:
              deletionPolicy: Orphan
              managementPolicies:
                - Observe
                - Create
              forProvider:
                mount: secret
                name: {{ $scKvPath }}
                dataJsonSecretRef:
                  name: {{ $scSeedName }}
                  namespace: {{ $provNs }}
                  key: data.json
              providerConfigRef:
                name: openbao
            {{- end }}
            {{- end }}

            {{- if gt (len $scEsData) 0 }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-externalsecret
              name: {{ $xrName }}-{{ $sc.name }}-es
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $scSecretName }}
                    namespace: {{ $ns }}
                  spec:
                    refreshInterval: 1h
                    {{- /* The tenant's own store: the kernel's is not usable
                         from a tenant's namespace. */}}
                    secretStoreRef:
                      kind: ClusterSecretStore
                      name: openbao-tenant-{{ $tenant }}
                    target:
                      name: {{ $scSecretName }}
                      creationPolicy: Owner
                      deletionPolicy: Retain
                    data:
                      {{ toYaml $scEsData | nindent 22 }}
              providerConfigRef:
                name: kubernetes
            {{- end }}

            {{- $scExtraVals := dict }}
            {{- if $sc.extraValues }}
            {{- $scRaw := $sc.extraValues | toJson }}
            {{- $scRaw = $scRaw | replace "${TENANT_DOMAIN}"    $domain }}
            {{- $scRaw = $scRaw | replace "${TENANT_NAMESPACE}" $ns }}
            {{- $scRaw = $scRaw | replace "${TENANT_ID}"        $tenant }}
            {{- $scRaw = $scRaw | replace "${APP_ID}"           $app }}
            {{- $scRaw = $scRaw | replace "${SIDECAR_ID}"       $sc.name }}
            {{- $scExtraVals = $scRaw | fromJson }}
            {{- end }}
            {{- /* Same retry as the app Release above, and for the same reason:
                   this Release waits too, so a failed one would otherwise stay
                   failed. */}}
            {{- $scObservedRelease := dig "resources" (printf "%s-%s-release" $app $sc.name) "resource" dict $.observed }}
            {{- $scRetryAfter := dig "spec" "forProvider" "values" "gentianRelease" "retryAfterRevision" 0 $scObservedRelease | int }}
            {{- if eq (dig "status" "atProvider" "state" "" $scObservedRelease) "failed" }}
            {{- $scRetryAfter = dig "status" "atProvider" "revision" 0 $scObservedRelease | int }}
            {{- end }}
            {{- if gt $scRetryAfter 0 }}
            {{- $scExtraVals = mergeOverwrite $scExtraVals (dict "gentianRelease" (dict "retryAfterRevision" $scRetryAfter)) }}
            {{- end }}
            {{- $scExtraVals = $scExtraVals | toJson | fromJson }}
            ---
            apiVersion: helm.crossplane.io/v1beta1
            kind: Release
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-release
              name: {{ $tenant }}-{{ $app }}-{{ $sc.name }}
            spec:
              # No rollbackLimit, for the reason on the app Release above: at
              # revision 1 provider-helm's rollback is an uninstall.
              forProvider:
                chart:
                  repository: {{ $sc.chart.repository }}
                  name: {{ $sc.chart.name }}
                  version: {{ $sc.chart.version | quote }}
                namespace: {{ $ns }}
                # Wait for the release's workloads, not just for Helm to have
                # applied the manifests.
                #
                # With wait: false the Release goes Ready the moment the objects
                # exist, so an App whose pods can never schedule still reports
                # Ready=True -- and function-auto-ready then marks the XR Ready,
                # and the Tenant says "All App claims are Ready". Odoo sat like
                # that for hours: its modules PVC asked for a StorageClass the
                # cluster does not have, three pods were Pending the whole time,
                # and every signal above them was green.
                #
                # The kernel's own releases (infra-data, suze) have always waited.
                # Apps are what a tenant actually sees, so a false green matters
                # more here, not less.
                #
                # 10m rather than infra-data's 5m: an app's first boot can include
                # schema migration or module installation. On timeout the Release
                # reports not-ready and says so, which is the outcome being asked
                # for -- a wrong answer arriving quickly is worse than a right one
                # arriving late.
                wait: true
                waitTimeout: "10m"
                skipCRDs: true
                # The tenant's namespace exists, and the account the release
                # is installed as may not create one.
                skipCreateNamespace: true
                {{- if gt (len $scExtraVals) 0 }}
                values:
                  {{ toYaml $scExtraVals | nindent 18 }}
                {{- end }}
                {{- if gt (len $scRelSet) 0 }}
                set:
                  {{ toYaml $scRelSet | nindent 18 }}
                {{- end }}
              # A tenant's chart is installed as the narrow account, not as the
              # kernel's cluster-admin one (gentian-os provider-configs.yaml).
              providerConfigRef:
                name: tenant-apps

            {{- if $sc.stableServiceName }}
            {{- $scSvcPort := default 80 ($sc.stableServicePort | int) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $app }}-{{ $sc.name }}-stable-svc
              name: {{ $xrName }}-{{ $sc.name }}-stable-svc
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: {{ $sc.stableServiceName }}
                    namespace: {{ $ns }}
                  spec:
                    selector:
                      app.kubernetes.io/instance: {{ $tenant }}-{{ $app }}-{{ $sc.name }}
                    ports:
                    - name: http
                      port: {{ $scSvcPort }}
                      targetPort: {{ $scSvcPort }}
                      protocol: TCP
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- end }}
            {{- end }}

            {{- /* ── Activate addons selected into this base (L3) ──────────────── */}}
            {{- /* Odoo's -i takes a comma-separated list, so one Job installs the whole
                   selection in a single startup and lets Odoo resolve inter-addon
                   dependencies itself — cheaper and more correct than one Job per addon.
                   -i is idempotent: already-installed addons are skipped.

                   The Job name carries a hash of the selection, so re-selecting the same
                   set is a no-op while changing it creates a new Job that runs. Removing
                   an addon does NOT uninstall it — that is the destructive purge path and
                   is deliberately not done here. */}}
            {{- /* gentian_os is always installed, selection or not. It is the platform
                   integration driver, not an optional feature: it forces the https scheme
                   Odoo otherwise gets wrong behind the gateway, auto-redirects an embedded
                   login to Keycloak for zero-click SSO, and registers the Keycloak OAuth
                   provider from OIDC_CLIENT_ID/OIDC_ISSUER on _register_hook. Without it
                   Odoo has no SSO at all and the embedded frame lands on a login form.
                   It also depends on auth_oauth, so `-i` pulls that in.

                   It ships in the odoo-modules repo, which the git-modules sidecar syncs
                   into /opt/odoo/custom-addons — so this Job depends on that sidecar
                   having cloned successfully. */}}
            {{- /* One Job per selection, composed only while it is needed: not
                   before the base release is Ready -- the Job mounts odoo-data,
                   which the release creates, and a Job composed earlier sat
                   Pending on "persistentvolumeclaim odoo-data not found", one
                   more for every change of the selection -- and not once the
                   selection is installed (addonsInstalled above). A composed
                   Job is kept until it is done, whatever the base does
                   meanwhile.

                   The Object is named by the selection and orphans its Job: a
                   selection changed while its Job runs drops the Object, and the
                   Job finishes and goes with its ttl, pods and all, instead of
                   being deleted with its pods left behind. */}}
            {{- if and (ne $addonsInstalled $addonHash) (or $baseReady (gt (len $observedAddons) 0)) }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $addonKey }}
              name: {{ $xrName }}-addons-{{ $addonHash }}
            spec:
              deletionPolicy: Orphan
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: odoo-addons-{{ $addonHash }}
                    namespace: {{ $ns }}
                    labels:
                      app.kubernetes.io/managed-by: gentian-os
                      gentianos.io/tenant: {{ $tenant }}
                      gentianos.io/app: {{ $app }}
                      gentianos.io/component: odoo-addons
                  spec:
                    ttlSecondsAfterFinished: 600
                    backoffLimit: 10
                    {{- /* This pod declares odoo-data in its volumes, so for as
                         long as it exists Kubernetes will not let that PVC
                         finish deleting -- kubernetes.io/pvc-protection counts a
                         pod that merely references the claim, init containers
                         and all. And wait-for-base below is an unbounded wait on
                         the base Odoo.

                         Put those together and there is a cycle: the PVC cannot
                         go while this pod holds it, a replacement odoo pod
                         cannot schedule against a PVC that is terminating, and
                         wait-for-base waits forever for the pod that cannot
                         start. Demo sat in it for an hour on 2026-09-04 with
                         odoo.<tenant> answering 500, and nothing in the cluster
                         would have broken the tie.

                         A deadline breaks it. The Job fails, the pod goes, the
                         PVC completes its deletion, and the ttl above then has
                         Crossplane compose a fresh Job into a world where Odoo
                         can actually come up. 20m is long enough for a genuinely
                         slow base boot and short enough to converge unattended.
                     */}}
                    activeDeadlineSeconds: 1200
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/managed-by: gentian-os
                          gentianos.io/tenant: {{ $tenant }}
                          gentianos.io/app: {{ $app }}
                          gentianos.io/component: odoo-addons
                      spec:
                        restartPolicy: OnFailure
                        securityContext:
                          seccompProfile:
                            type: RuntimeDefault
                        initContainers:
                          {{- /* The Job's own copy of the modules.

                                 It used to mount the modules PVC the sidecar
                                 Deployment wrote, and poll for gentian_os for up
                                 to five minutes, because it was racing a clone
                                 happening in another pod. Odoo now syncs inside
                                 its own pod to an emptyDir, which no Job can
                                 share -- so the Job clones for itself. 2.3MB of
                                 public git, and the race goes with it:
                                 initContainers are ordered, so the modules are
                                 on disk before anything looks for them. */}}
                          - name: git-sync-modules
                            image: registry.k8s.io/git-sync/git-sync:v4.2.3
                            securityContext:
                              runAsUser: 999
                              runAsGroup: 999
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            args:
                              - --repo=https://github.com/gentian-org/odoo-modules.git
                              - --branch=develop
                              - --root=/opt/odoo/custom-addons
                              - --dest=default/current
                              - --submodules=recursive
                              - --one-time
                              {{- /* git-sync aborts on the first failed fetch
                                   unless told otherwise, so one transient error
                                   from the git host left this Job in
                                   Init:CrashLoopBackOff and the tenant's module
                                   install simply never happened. Bounded rather
                                   than the sidecar's -1: an init container has
                                   to finish. */}}
                              - --max-failures=5
                            volumeMounts:
                              - name: extra-addons
                                mountPath: /opt/odoo/custom-addons
                          - name: wait-for-base
                            image: postgres:16-alpine
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            command:
                              - sh
                              - -c
                              - |
                                until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                                  echo "waiting for postgres..."
                                  sleep 2
                                done
                                until nc -z odoo 8069; do
                                  echo "waiting for base odoo service..."
                                  sleep 2
                                done
                                # No wait for gentian_os: the git-sync-modules
                                # init container above already put it on this
                                # pod's volume, and initContainers run in order.
                            volumeMounts:
                              - name: extra-addons
                                mountPath: /opt/odoo/custom-addons
                            env:
                              - name: DB_HOST
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-host
                              - name: DB_PORT
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-port
                              - name: DB_USER
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-user
                        containers:
                          - name: odoo-addons
                            securityContext:
                              allowPrivilegeEscalation: false
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            image: "ghcr.io/gentian-org/ocb:latest"
                            command:
                              - /bin/sh
                              - -ec
                              - |
                                python3 /opt/odoo/src/odoo/odoo-bin \
                                  -d "${DB_NAME}" \
                                  --db_host="${DB_HOST}" \
                                  --db_port="${DB_PORT}" \
                                  --db_user="${DB_USER}" \
                                  --db_password="${DB_PASSWORD}" \
                                  --config=/etc/odoo/odoo.conf \
                                  -i "{{ $addonList }}" \
                                  --without-demo=all \
                                  --stop-after-init
                            env:
                              - name: DB_HOST
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-host
                              - name: DB_PORT
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-port
                              - name: DB_USER
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-user
                              - name: DB_PASSWORD
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-password
                              - name: DB_NAME
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: db-name
                              {{- /* gentian_os registers the Keycloak OAuth provider in
                                     _register_hook, which runs on registry load — including
                                     this install run. It reads these two from the
                                     environment and silently does nothing without them, so
                                     the provider must be seeded here rather than waiting for
                                     the next restart of the long-running deployment. */}}
                              - name: OIDC_CLIENT_ID
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: oidc-client-id
                              - name: OIDC_ISSUER
                                valueFrom:
                                  secretKeyRef:
                                    name: {{ $app }}-sensitive-values
                                    key: oidc-issuer
                            volumeMounts:
                              - name: odoo-config
                                mountPath: /etc/odoo
                              - name: odoo-data
                                mountPath: /opt/odoo/data
                              - name: extra-addons
                                mountPath: /opt/odoo/custom-addons
                        volumes:
                          - name: odoo-config
                            configMap:
                              name: odoo-config
                          - name: odoo-data
                            persistentVolumeClaim:
                              claimName: odoo-data
                          # emptyDir, not the shared PVC: git-sync-modules above
                          # fills it, and nothing outside this pod reads it.
                          - name: extra-addons
                            emptyDir: {}
              providerConfigRef:
                name: kubernetes
            {{- end }}
            {{- /* closes: if the profile is the base. Addons no longer render a
                   release of their own — they are activated into this base from
                   spec.addons above. */}}
            {{- end }}

    # ── Step 3: Mark XR Ready when all composed resources are Ready ───────────
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
