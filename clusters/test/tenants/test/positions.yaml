# Managed by the director: this tenant's own positions, beside the three
# every tenant has. What a position is, is declared here; who holds it is
# given in the Admin Console and lives in the rights store.
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: test
spec:
  positions:
  - includes:
    - user
    name: core-team
    roles:
    - app: aluvian-center-pe
      role: admin
    - app: nextcloud-calendar-ce
      role: admin
    title: Core Team
  - includes:
    - core-team
    name: manager
    title: Manager
