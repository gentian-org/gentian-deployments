# Managed by the director: this tenant's resource plan, chosen in the
# administration console by whoever the commit names. Edit it there, so
# the change is a priced plan and not an unbilled ceiling. Hand edits are
# honoured by the cluster and reported as drift by the console.
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: test
  annotations:
    gentianos.io/resource-plan: nodes-2
    gentianos.io/resource-plan-set-by: "admin@test.gentian-os.org"
spec:
  quotas:
    requestsCpu: "8"
    requestsMemory: "32Gi"
    cpu: "32"
    memory: "64Gi"
    storage: "100Gi"
    maxPods: null
