# Managed by the director: what each app of this tenant may consume from
# the others, and which may consume from it, with who granted it and when.
# Set in the administration console by whoever may grant (can_grant); the
# operator makes each the AppGrant of its app in the tenant's namespace.
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: test
spec:
  grants:
  - app: app-store-pe
    consume:
    - contract: desktop-api
      granted:
      - tiles
    grantedAt: "2026-10-30T16:42:03Z"
    grantedBy: platform:placement
    reason: 'pre-approved by the platform: both components are placed by it'
