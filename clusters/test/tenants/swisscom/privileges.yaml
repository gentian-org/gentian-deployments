# Managed by the director: the privilege requests somebody approved for
# this tenant. Each entry names the component it applies to, the request
# it answers, who answered and why. The operator copies them onto the
# Component; a component with an unanswered request waits rather than
# starting without the privilege.
#
# Removing an entry withdraws the privilege. The component then holds
# again, which is where it was before the approval.
