# Tenant cxg, brought on through the director.
#
# Argo CD syncs this file and the operator does the rest: the Keycloak realm,
# the namespaces, the database, and the tenant's desktop. Nothing about the
# tenant exists until this file does, and editing it is how it changes.
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: cxg
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  displayName: City Expert Group (CXG)
  # The administrator account has no password until its holder sets one,
  # through a single-use link the director issues (activate-admin).
  admin:
    requireMFA: false
  isolation:
    # A namespace per tenant and a realm of its own. The realm is what keeps
    # one tenant's administrators from seeing another's people at all, rather
    # than being trusted not to look.
    mode: namespace
    keycloakRealm: cxg
    # A database name has no hyphens: the tenant's become underscores.
    databasePrefix: cxg_
    s3Prefix: cxg-
  # Retain, so retiring the tenant does not take its data with it. Changing
  # this to Delete is a deliberate, reviewable edit.
  deletionPolicy: Retain
  # The base plan's capacity, which is what every tenant starts on. A tenant
  # that needs more gets it by editing this block, which is one more commit.
  quotas:
    requestsCpu: "4"
    requestsMemory: 16Gi
    cpu: "16"
    memory: 32Gi
    storage: 50Gi
  # Apps are installed through the director, which appends to this list.
  apps:
  - profile: nextcloud-base-ce
    digest: sha256:d8f5463cfefc6217ef3ed022dbf6a7db6186f0594ce269cc8c16dfb67d485d76
    catalogue: gentian
  - profile: deckcraft-ce
    digest: sha256:f708292962316bc896334bcb1ab71e3a8e0e4cd2e63b3b0edcbcf9f3e70cb754
    catalogue: gentian
  - profile: open-webui-ce
    digest: sha256:51eb88b1fce3c1505304d2146fba1ee5f1ff5aa36820694f6e9e4b3d5312aaab
    catalogue: gentian
  - profile: porter
    placed: true
  - profile: homesync
    placed: true
  - profile: desktop
    placed: true
  - profile: app-store-pe
    placed: true
  - profile: aluvian-center-pe
    placed: true
  - profile: admin-console
    placed: true
  country: "SR"
  storeTerms:
    version: "2026-10"
    acceptedAt: "2026-11-26T11:55:42Z"
