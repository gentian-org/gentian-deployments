# Managed by the director: what each app of this tenant may consume from
# the others, and which may consume from it, with who granted it and when.
# Set in the administration console by whoever may grant (can_grant); the
# operator makes each the AppGrant of its app in the tenant's namespace.
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: cxg
spec:
  grants:
  - app: app-store-pe
    consume:
    - contract: desktop-api
      granted:
      - tiles
    grantedAt: "2026-11-26T11:41:54Z"
    grantedBy: platform:placement
    reason: 'pre-approved by the platform: both components are placed by it'
  - app: deckcraft-ce
    consume:
    - contract: file-store
      granted:
      - webdav:read
      - webdav:write
    grantedAt: "2026-11-26T11:56:03Z"
    grantedBy: 350b367c-5118-45c1-8cba-0a35faf7044c
    reason: granted with the install of the app
  - app: nextcloud-base-ce
    consume:
    - contract: central-navigation
      granted:
      - navigation:register
    - contract: office-editor
      granted:
      - wopi:edit
    grantedAt: "2026-11-26T11:58:39Z"
    grantedBy: 350b367c-5118-45c1-8cba-0a35faf7044c
    reason: granted with the install of the app
  - app: odoo-base-ce
    consume:
    - contract: central-navigation
      granted:
      - navigation:register
    grantedAt: "2026-11-26T11:59:11Z"
    grantedBy: 350b367c-5118-45c1-8cba-0a35faf7044c
    reason: granted with the install of the app
