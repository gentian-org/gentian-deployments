# Managed by the Gentian resources API — edit through
#   kubectl gentian resources set demo --plan <plan>
# or the Admin Console's Resources tab, so the change is a priced plan
# and not an unbilled ceiling. Hand edits here are honoured by the
# cluster and reported as drift by the console.
apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: demo
  annotations:
    gentianos.io/resource-plan: base
spec:
  quotas:
    requestsCpu: "2"
    requestsMemory: "4Gi"
    cpu: "8"
    memory: "8Gi"
    storage: "50Gi"
    maxApps: 5
    maxPods: null
