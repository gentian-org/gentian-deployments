apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: corp
spec:
  displayName: Gentian Corp
  isolation:
    databasePrefix: corp_
    keycloakRealm: corp
    s3Prefix: corp-
  deletionPolicy: Retain
  apps:
  - profile: nextcloud-base-ce
    addons:
    - nextcloud-richdocuments-ce
    - nextcloud-forms-ce
    - nextcloud-mail-ce
    - nextcloud-calendar-ce
    - nextcloud-contacts-ce
    - nextcloud-tasks-ce
    - nextcloud-deck-ce
    - nextcloud-collectives-ce
    - nextcloud-spreed-ce
  - profile: docmost-ce
  - profile: odoo-base-ce
    # Restart Odoo automatically when a new commit reaches the odoo-modules
    # branch it tracks, and regenerate the asset bundles on that restart.
    #
    # Odoo resolves addons_path through realpath() once at startup, so a
    # git-sync symlink flip afterwards is invisible to the running process:
    # new module code reaches the disk and is never served. Until now the only
    # cure was noticing and running `kubectl rollout restart` by hand.
    #
    # Scoped to this tenant deliberately. Every Odoo tenant tracks the same
    # odoo-modules branch, so any commit there restarts every tenant that has
    # this on -- corp is where that code is being developed and tested, so it
    # is the tenant that wants it. See charts/odoo/values.yaml in gentian-apps
    # for the full tradeoff.
    config:
      extraValues:
        gentian:
          git:
            autoReload:
              enabled: true
    addons:
    - odoo-accounting-ce
    - odoo-employees-ce
    - odoo-inventory-ce
    - odoo-purchase-ce
    - odoo-contacts-ce
    - odoo-crm-ce
  - profile: app-store-me
  # Gentian Subscriptions (ApiProfile) — commerce/billing tile, installed by
  # default (opt-out). Requires gentian-os with the api deployment method (Phase B).
  - profile: gentian-subscriptions-me
