apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: corp
spec:
  displayName: Gentian Corp
  isolation:
    databasePrefix: corp_
    keycloakRealm: corp
    s3Prefix: corp-
  deletionPolicy: Retain
  apps:
  - profile: nextcloud-base-ce
  - profile: app-store-me
  # Gentian Subscriptions (ApiProfile) — commerce/billing tile, installed by
  # default (opt-out). Requires gentian-os with the api deployment method (Phase B).
  - profile: gentian-subscriptions-me
