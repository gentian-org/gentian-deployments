apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: placeholder  # matched via the target selector in kustomization.yaml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # deletionPolicy is set per instance in tenant.yaml (Retain default).
  isolation:
    mode: namespace
  mail:
    domain: gtn.host
    mode: selfhosted
    quotaPerUser: 5Gi
    rateLimit: 100/h
  quotas:
    cpu: 32
    maxApps: 20
    memory: 32Gi
    storage: 100Gi
