apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: placeholder  # matched via the target selector in kustomization.yaml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # deletionPolicy is set per instance in tenant.yaml (Retain default).
  isolation:
    mode: namespace
  mail:
    # No domain here. Absent, the operator derives it from the tenant and the
    # cluster's kernel domain — corp.gtn.host under TENANCY_MODE=multi — which
    # is the same domain the platform derives the admin address in
    # (admin@corp.gtn.host).
    #
    # Hardcoding the kernel domain gave every tenant the same mail domain, so
    # Postfix accepted gtn.host and refused corp.gtn.host, and the registry held
    # one entry per tenant all naming it. Set this per tenant only where a
    # tenant genuinely owns a different domain.
    mode: selfhosted
  quotas:
    cpu: 32
    maxApps: 20
    memory: 32Gi
    storage: 100Gi
