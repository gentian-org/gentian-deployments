# Cluster overlay — only what's unique to THIS cluster. Tier-wide policy
# lives in gentian-deployments/profiles/prod.yaml (Layer 2); chart
# defaults live in gentian-os/charts/gentian-os/values.yaml (Layer 1).
# Also read directly by the gentian-portal Application for kernelDomain
# (portal chart is separate from the operator chart but shares this file).
kernelDomain: gtn.host
stage: prod

# The name that resolves to the address mail LEAVES from — the dedicated egress
# floating IP, not the inbound load balancer.
#
# The operator builds each tenant's SPF record from this. Left empty it falls
# back to "v=spf1 mx ~all", which authorises the MX: on this cluster that is
# 83.228.248.114, the inbound load balancer, while mail actually leaves from
# 37.156.43.16. Every message then soft-fails SPF against a record that reads as
# correct, which is the hardest kind of mail fault to see.
mailEgressHost: out.gtn.host

# kernel, matching this cluster's Cluster claim: Postfix and Dovecot run here and
# mailboxes are local, rather than sitting at a provider.
#
# The operator reads its mail mode from this file and not from the claim, because
# nothing carries spec.mail.serviceMode through at runtime. Left unset it fell back
# to the chart default, external, and the operator then skipped Dovecot entirely —
# no realm client, no XOAUTH2 auth, and the Dovecot ApplicationSet not rendered at
# all, which left the running Dovecot with no owner. See gentian-os roadmap 1.22:
# until the composition carries this, it has to be set here AND on the appsets
# Application, and the two must agree.
mailServiceMode: kernel
llmSupport: false

# There is no stage-named tag: CI publishes v1.2.3 for a release, develop/main
# for a branch, and develop-abc1234 for a commit on one. A prod cluster should
# name an immutable build — a digest, or a v1.2.3 once released — rather than
# follow a branch. See gentian-os/docs/deployment.md §4.
image:
  tag: "develop"

api:
  env:
    BACKEND_CORS_ORIGINS: https://portal.gtn.host

appLifecycle:
  deployments:
    enabled: true
    cluster: ifk-w4h
    repo: https://github.com/gentian-org/gentian-deployments
    gitCredentialsSecret: gentian-deployments-git-credentials
