# Cluster overlay — only what's unique to THIS cluster. Tier-wide policy
# lives in gentian-deployments/profiles/prod.yaml (Layer 2); chart
# defaults live in gentian-os/charts/gentian-os/values.yaml (Layer 1).
# Also read directly by the gentian-portal Application for kernelDomain
# (portal chart is separate from the operator chart but shares this file).
kernelDomain: gentian.cloud
stage: prod
llmSupport: false

# Where abuse@ and postmaster@ are delivered, for every domain this cluster
# accepts mail for.
#
# Off-cluster deliberately, and the operator refuses an address inside a domain
# this cluster hosts: every local mailbox is a maildir Dovecot opens only for a
# Keycloak user, so aliasing to one would move the mail without giving it a
# reader. Unset, both addresses keep arriving and keep being unreadable.
#
# Needed to register with Microsoft's JMRP and SNDS, which mail both addresses
# and enrol nobody who does not answer.
mailAdminContact: ch.braendli@proton.me

image:
  tag: "develop"

api:
  env:
    BACKEND_CORS_ORIGINS: https://portal.gentian.cloud

appLifecycle:
  deployments:
    enabled: true
    cluster: ifk-w4h
    repo: https://github.com/gentian-org/gentian-deployments
    gitCredentialsSecret: deployments-git-credentials
