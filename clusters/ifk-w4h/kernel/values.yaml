# Cluster overlay — only what's unique to THIS cluster. Tier-wide policy
# lives in gentian-deployments/profiles/prod.yaml (Layer 2); chart
# defaults live in gentian-os/charts/gentian-os/values.yaml (Layer 1).
# Also read directly by the gentian-portal Application for kernelDomain
# (portal chart is separate from the operator chart but shares this file).
kernelDomain: gtn.host
stage: prod


llmSupport: false

# There is no stage-named tag: CI publishes v1.2.3 for a release, develop/main
# for a branch, and develop-abc1234 for a commit on one. A prod cluster should
# name an immutable build — a digest, or a v1.2.3 once released — rather than
# follow a branch. See gentian-os/docs/deployment.md §4.
image:
  tag: "develop"

api:
  env:
    BACKEND_CORS_ORIGINS: https://portal.gtn.host

appLifecycle:
  deployments:
    enabled: true
    cluster: ifk-w4h
    repo: https://github.com/gentian-org/gentian-deployments
    gitCredentialsSecret: gentian-deployments-git-credentials
