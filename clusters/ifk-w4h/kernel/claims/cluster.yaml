apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: ifk-w4h-prod
  namespace: crossplane-system
spec:
  kernelDomain: gtn.host
  tenancyMode: multi
  networkMode: static-ip
  nodeIp: 179.237.73.52
  routingMode: gateway
  secretMode: derived
  # Who runs the machines. Decides the LoadBalancer annotations the gateway and
  # mail Services need — without it they render bare and Octavia never attaches a
  # health monitor.
  platform: infomaniak
  certificates:
    issuerMode: acme-dns01
    # Who hosts the zone. Separate from issuerMode because they answer different
    # questions, and it is also what tells external-dns which provider to use —
    # left unset it falls back to the chart default (aws) and every DNS write
    # fails against Route 53.
    dnsProvider: cloudflare
  mail:
    serviceMode: kernel
    # The hostname outbound mail leaves from. Floating IP 37.156.43.16 is
    # attached to the node Postfix is pinned to, so this cluster sends from an
    # address it owns and can set the PTR for — rather than the router's shared
    # SNAT address, whose reverse DNS nobody owns.
    #
    # Setting this also pins Postfix to that node: an address that can move is an
    # address whose PTR and SPF record stop matching.
    egressHost: out.gtn.host
