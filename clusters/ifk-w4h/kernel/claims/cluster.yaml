apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: ifk-w4h-prod
  namespace: crossplane-system
spec:
  kernelDomain: gentian.cloud

  # Where this cluster runs. Selects the edge load-balancer settings
  # its provider needs; see kernel/platforms.yaml for the full list.
  #   self-hosted  bare metal or a VM you own, addressed by MetalLB
  #   openstack / infomaniak / hetzner / aws / gcp / azure
  #   none         no load-balancer integration at all
  # Left unset it is detected from the nodes providerID.
  # platform:                    detected from the nodes
  # platformParams:              hetzner needs location; azure a
  #                              publicIpResourceGroup

  # How traffic reaches this cluster.
  #   tunnel     behind a reverse proxy or tunnel; nodeIp is not used
  #   static-ip  DNS points straight at nodeIp, which is then required
  networkMode: static-ip
  nodeIp: 179.237.73.52
  # addressRef:                  AWS eipalloc ids or an Azure public
  #                              IP name; neither takes an address

  # Who issues TLS certificates, and who hosts the zone. Two questions:
  # how control is proved, and by whom.
  #   acme-dns01   Lets Encrypt over DNS-01; the only path to a wildcard
  #   acme-http01  Lets Encrypt over HTTP-01; needs port 80 reachable
  #   private-ca   your own CA, supplied as certificates.caBundleSecretRef
  #   self-signed  no public DNS and no ACME reachability; browsers warn
  certificates:
    issuerMode: acme-dns01
    # cloudflare, route53, clouddns, azuredns, rfc2136, hetzner,
    # infomaniak — independent of platform above.
    dnsProvider: cloudflare
    # dnsParams:                route53 needs region and
    #                           hostedZoneID; clouddns a project
    # external-dns writes this zone from the Gateway hostnames.
    # Set false where something else already owns these records.
    #
    # This cluster has networkMode: static-ip and a nodeIp, so there is a fixed
    # address to publish and a provider named above to publish it with. Without
    # this, B-03 never creates the external-dns Application, nothing writes an A
    # record for id. or portal., and the first step needing a public name waits
    # for something nobody is producing.
    externalDns: true
    # caBundleSecretRef:         only read when issuerMode is private-ca

  # Where mail goes.
  #   external  relay through an SMTP provider; supply the smtp-relay
  #             credential to the credential manager after install
  #   kernel    in-cluster Postfix/Dovecot; requires networkMode static-ip
  mail:
    serviceMode: kernel
    # host:                     not used while serviceMode is kernel
    # The name outbound mail leaves from, and the whole reason SPF can pass on
    # this cluster. Without it the operator falls back to "v=spf1 mx ~all",
    # which names the INBOUND load balancer (83.228.248.255) -- an address that
    # never sends -- so the record fails by construction while looking
    # plausible. mail_reconciler.go says exactly that.
    #
    # With it the record becomes "v=spf1 a:mail-egress.gentian.cloud -all".
    #
    # It has to agree with three things that are not in this repo:
    #   floating IP 37.156.43.16 attached to the Postfix node's port
    #   PTR   37.156.43.16 -> mail-egress.gentian.cloud.
    #   A     mail-egress.gentian.cloud -> 37.156.43.16   (manual, in Cloudflare)
    # Gmail checks the forward and reverse agree; all three are in place today.
    egressHost: mail-egress.gentian.cloud

  # Defaults below are in effect. Uncomment a line to change it.
  # tenancyMode:  multi      one subdomain and Keycloak realm per tenant; single = one tenant owns the cluster
  # secretMode:   derived    every kernel secret reproducible from the master password; random = independent
  # routingMode:  gateway    Envoy Gateway plus the Gateway API; the only supported value
  # storageClass: ""         empty means the clusters default StorageClass
  # llm:
  #   enabled: false            set true on a cluster that serves models
  #   gpuAcceleration: false    set true when the cluster has GPUs
  #   gpuTimeSliceReplicas: 1   workloads sharing one physical GPU
  #   instances: []             the models to serve; see the XRD for fields

  # Human write access to OpenBao, federated from Keycloak.
  # discoveryUrl is what creates the backend; without it the only
  # write path is the installer bootstrap token, which E-04 revokes.
  oidc:
    discoveryUrl: https://id.gentian.cloud/auth/realms/kernel
    # clientId:          openbao
    # clientSecretRef:   openbao-oidc-client   Secret in the OpenBao namespace
    # clusterAdminGroup: /gentian:platform:superadmin
    # externalUrl:                             OpenBao UI callback, if exposed
