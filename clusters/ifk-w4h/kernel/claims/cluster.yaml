apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: ifk-w4h-prod
  namespace: crossplane-system
spec:
  kernelDomain: gtn.host
  tenancyMode: multi
  networkMode: static-ip
  nodeIp: 179.237.73.52
  routingMode: gateway
  secretMode: derived
  # Who runs the machines. Decides the LoadBalancer annotations the gateway and
  # mail Services need — without it they render bare and Octavia never attaches a
  # health monitor.
  platform: infomaniak
  certificates:
    issuerMode: acme-dns01
    # Who hosts the zone. Separate from issuerMode because they answer different
    # questions, and it is also what tells external-dns which provider to use —
    # left unset it falls back to the chart default (aws) and every DNS write
    # fails against Route 53.
    dnsProvider: cloudflare
  mail:
    serviceMode: kernel
    # The hostname outbound mail leaves from. Floating IP 37.156.43.16 is
    # attached to the node Postfix is pinned to, so this cluster sends from an
    # address it owns and can set the PTR for — rather than the router's shared
    # SNAT address, whose reverse DNS nobody owns.
    #
    # Setting this also pins Postfix to that node: an address that can move is an
    # address whose PTR and SPF record stop matching.
    egressHost: out.gtn.host

  # Human write access to OpenBao, federated from Keycloak.
  #
  # discoveryUrl is what creates the backend: the composition gates the Keycloak
  # client, the client Secret and the OpenBao policies on it, B-07 enables the
  # mount and D-06 writes the config. Without it none of that exists, and the
  # only write path is the installer's bootstrap token — which E-04 revokes, and
  # refuses to revoke while nothing else can write. An install then cannot
  # finish its last step, which is what happened here: signing in recorded
  # nothing, because nothing was listening.
  oidc:
    discoveryUrl: https://id.gtn.host/auth/realms/kernel
    # clientId:          openbao
    # clientSecretRef:   openbao-oidc-client   Secret in the OpenBao namespace
    # clusterAdminGroup: /gentian:platform:superadmin
    # externalUrl:                             OpenBao UI callback, if exposed
