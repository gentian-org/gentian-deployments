apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: test
spec:
  displayName: test

  # No adminEmail here. The administrator address is derived:
  #   admin@test.gentian-os.org
  # and it is the Keycloak username too — one identifier, not
  # two that can disagree. Setting it would point the account at
  # an address the tenant does not control; this account is
  # recovered by the cluster administrator, not by mail.

  # Where this tenant is served. Left unset it is test.gentian-os.org,
  # which is what a multi-tenant cluster wants. Set it to serve the
  # tenant on a domain they own instead.
  # domain: test.example.org

  # Prefixes keep one tenant out of another tenant name-space in the
  # shared data stores. Changing them after provisioning strands what
  # was created under the old ones.
  isolation:
    keycloakRealm: test
    databasePrefix: test_
    s3Prefix: test-

  # Retain keeps the data when the Tenant is deleted; Delete removes it.
  deletionPolicy: Retain

  # Quotas and mail come from this cluster's shared tenant-defaults
  # component, which the deploy command creates. Override here only
  # what this tenant needs differently from the rest.

  # Apps are installed by profile name from the catalogue.
  #   kubectl gentian apps list      what this cluster offers
  #
  # A profile that is not in the catalogue is refused at admission,
  # naming the profile — so a typo here fails on deploy, not later.
  apps:
  - profile: nextcloud-base-ce
    addons:
    - nextcloud-richdocuments-ce
    - nextcloud-forms-ce
    - nextcloud-mail-ce
    - nextcloud-calendar-ce
    - nextcloud-contacts-ce
    - nextcloud-tasks-ce
  - profile: odoo-base-ce
    addons:
    - odoo-accounting-ce
    - odoo-contacts-ce
    - odoo-crm-ce
    - odoo-employees-ce
    - odoo-inventory-ce
    - odoo-pos-ce
    - odoo-purchase-ce
    - odoo-website-ce
  - profile: docmost-ce
  # The app store is how a tenant admin installs everything else. A
  # tenant scaffolded without it can only be changed by editing this
  # file, so it is the one entry that is not really optional.
  - profile: app-store-me
  # Subscriptions is an ApiProfile: it runs no pods in the tenant and
  # only adds a portal tile for billing and entitlements. On by
  # default, opt-out — delete this entry for a tenant that should not
  # see it.
  - profile: gentian-subscriptions-me
  # AI Chat, listed because this cluster serves LLM
  # (spec.llm.enabled on the Cluster claim). Delete the entry for a
  # tenant that should not see it.
  #
  # Temporarily removed: its PVC was deleted by hand, and provider-helm
  # reconciles release state rather than cluster contents — it compares the
  # desired chart and values against the recorded release, finds them in
  # agreement, and does nothing. An object deleted out from under a live
  # release is never restored by a sync, a selfHeal or a pod restart. Taking
  # the profile out and putting it back is what forces a fresh install.
  # - profile: open-webui
  # Everything else this tenant needs goes beside them, for example:
  # - profile: nextcloud-base-ce
  #   addons:
  #   - nextcloud-calendar-ce
