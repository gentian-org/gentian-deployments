apiVersion: gentianos.io/v1alpha1
kind: Cluster
metadata:
  name: gentian-os-dev
  namespace: kernel-provisioning
spec:
  kernelDomain: gentian-os.org
  # Who administers this cluster, by the Keycloak group they are in. The
  # director reads this file from git -- not the object in the cluster -- so
  # the assignment is written here rather than left to the schema's default,
  # which a file reader never sees. Without it the director grants nobody a
  # cluster role and every console the person is entitled to disappears.
  platformRoles:
    admin: gentian:platform:admin

  # Where this cluster runs. Selects the edge load-balancer settings
  # its provider needs; see kernel/platforms.yaml for the full list.
  #   self-hosted  bare metal or a VM you own, addressed by MetalLB
  #   openstack / infomaniak / hetzner / aws / gcp / azure
  #   none         no load-balancer integration at all
  # Left unset it is detected from the nodes providerID.
  platform: self-hosted
  # platformParams:              hetzner needs location; azure a
  #                              publicIpResourceGroup

  # How traffic reaches this cluster.
  #   tunnel     behind a reverse proxy or tunnel; nodeIp is not used
  #   static-ip  DNS points straight at nodeIp, which is then required
  networkMode: tunnel
  # nodeIp:                      not used while networkMode is tunnel
  # addressRef:                  AWS eipalloc ids or an Azure public
  #                              IP name; neither takes an address

  # Who issues TLS certificates, and who hosts the zone. Two questions:
  # how control is proved, and by whom.
  #   acme-dns01   Lets Encrypt over DNS-01; the only path to a wildcard
  #   acme-http01  Lets Encrypt over HTTP-01; needs port 80 reachable
  #   private-ca   your own CA, supplied as certificates.caBundleSecretRef
  #   self-signed  no public DNS and no ACME reachability; browsers warn
  certificates:
    issuerMode: acme-dns01
    # staging: untrusted certificates, generous rate limits.
    # Switch to production once the names are settled.
    acmeEnv: staging
    # cloudflare, route53, clouddns, azuredns, rfc2136, hetzner,
    # infomaniak — independent of platform above.
    dnsProvider: cloudflare
    # dnsParams:                route53 needs region and
    #                           hostedZoneID; clouddns a project
    # externalDns: true         let external-dns write this zone.
    #                           Off while networkMode is tunnel: there
    #                           is no fixed address to publish, and the
    #                           operator writes the tenant records
    #                           through the tunnel CNAMEs itself.
    # caBundleSecretRef:         only read when issuerMode is private-ca

  # Where mail goes.
  #   external  relay through an SMTP provider; supply the smtp-relay
  #             credential to the credential manager after install
  #   kernel    in-cluster Postfix/Dovecot; requires networkMode static-ip
  mail:
    serviceMode: external
    host: smtp.gmail.com
    # port: 587                 defaults to 587
    # starttls: true            defaults to true
    # egressHost:               only for a cluster that sends from its own
    #                           address rather than through the relay above

  # Defaults below are in effect. Uncomment a line to change it.
  # tenancyMode:  multi      one subdomain and Keycloak realm per tenant; single = one tenant owns the cluster
  # secretMode:   derived    every kernel secret reproducible from the master password; random = independent
  # routingMode:  gateway    Envoy Gateway plus the Gateway API; the only supported value
  storageClass: nfs-csi

  # Where the backup private key lives. On by default: it goes to OpenBao as
  # well as the recovery kit, so a cluster administrator can restore without
  # the kit -- and anyone who reaches OpenBao as one can read every bundle.
  # Set false to keep it in the kit alone: nothing the cluster holds can then
  # open a bundle, and losing every copy of the kit loses every backup.
  # backup:
  #   escrowIdentity: true
  llm:
    enabled: true
    gpuAcceleration: true
    # gpuTimeSliceReplicas: 1   workloads sharing one physical GPU
    # The models this cluster serves. Removing an entry removes its
    # workload; the cached weights survive, so re-adding the same
    # name does not download tens of gigabytes again.
    instances: []
    #  - name: qwen
    #    modelId: Qwen/Qwen2.5-7B-Instruct
    #    gpuMemoryUtilization: "0.85"   fraction of GPU memory
    #    maxModelLen: "8192"            context window, tokens
    #    modelCacheSize: 60Gi           PVC for the weights
    #    imageTag: latest               vLLM image tag
    #    toolCallParser: hermes         empty disables tool calling
    # External OpenAI-compatible providers, routed through the same
    # gateway. Independent of gpuAcceleration -- a cluster with no GPU
    # and no instances serves these and nothing else. Adding an entry
    # registers its models; removing one deregisters them.
    providers: []
    #  - name: infomaniak
    #    displayName: Infomaniak AI Services
    #    # Up to and including the version segment. The number is the
    #    # AI product id (GET /1/ai returns it), not an account id.
    #    apiBase: https://api.infomaniak.com/2/ai/<product-id>/openai/v1
    #    # A property of the llm-provider-<name> credential, supplied
    #    # in the Admin Console. Never the token itself.
    #    apiKeyProperty: infomaniak_api_key
    #    models:
    #      - name: gemma-4-31b              offered as infomaniak/gemma-4-31b
    #        model: google/gemma-4-31B-it   the id the provider expects
    #        maxTokens: 8192                omitted leaves LiteLLM guessing
    #        mode: chat                     embedding models must say so

  # Human write access to OpenBao, federated from Keycloak.
  # discoveryUrl is what creates the backend; without it the only
  # write path is the installer bootstrap token, which E-03 revokes.
  oidc:
    discoveryUrl: https://id.gentian-os.org/auth/realms/kernel
    # clientId:          openbao
    # clientSecretRef:   openbao-oidc-client   Secret in the OpenBao namespace
    # clusterAdminGroup: /gentian:platform:admin
    # externalUrl:                             OpenBao UI callback, if exposed

  # Catalogues this cluster may fetch profiles from. A tenant installing
  # "main/nextcloud-base-ce" gets the bundle from the source named main,
  # at the digest the App Store stated -- the source itself is not trusted.
  #
  #   access: entitled   the store decides, per tenant, with a signed grant
  #   access: open       your own repository; the tenants listed here may
  #                      install from it with no grant. Nothing is open by
  #                      default, and removing a tenant closes it again.
  # catalogue:
  #   # Where people are sent for everything the cluster does not
  #   # list itself: the maintained (me) and licensed (ee) editions.
  #   # A cluster lists only ce and pe from its own sources.
  #   storeUrl: https://gentian.org/apps
  #   sources:
  #     - name: main
  #       url: https://store.gentian.org/catalogue
  #       access: entitled
  #     - name: in-house
  #       url: https://git.example.com/profiles
  #       access: open
  #       tenants: [demo]
