apiVersion: gentianos.io/v1alpha1
kind: Tenant
metadata:
  name: placeholder  # matched via the target selector in kustomization.yaml
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # deletionPolicy is set per instance in tenant.yaml (Retain default).
  isolation:
    mode: namespace
  mail:
    # No domain: each tenant's is its own. See the note above.
    mode: selfhosted
  quotas:
    # The `base` plan's capacity, so a freshly deployed tenant starts on a
    # priced plan instead of a ceiling that matches none. maxApps is a policy
    # limit rather than part of the plan, so it is set here and in no plan.
    requestsCpu: "2"
    requestsMemory: 4Gi
    cpu: "8"
    memory: 8Gi
    storage: 50Gi
    maxApps: 20
