# profiles/_base.yaml — shared by every stage profile (loaded before
# profiles/<stage>.yaml in the Helm valueFiles chain).
#
# Exists for values that are the same across all stages of this deployment
# but too app/catalogue-specific to belong in gentian-os's own chart
# defaults (which must stay app-agnostic — see gentian-os/docs/deployment.md
# §1). If a value is truly universal regardless of deployer, it belongs in
# the chart instead of here; if it's stage-specific, it belongs in
# profiles/<stage>.yaml instead.

# Kyverno MAC policy waivers for catalogue apps whose upstream images need
# relaxed pod security (sidecar containers, etc.) — depends on which apps
# this deployment's tenants use, not on stage.
platformSecurityPolicy:
  allowedMacWaivers:
    - profile: element-ce
      policy: gentian-require-non-root
      scope: sidecar-jitsi
    - profile: element-ce
      policy: gentian-restrict-capabilities
      scope: sidecar-jitsi
    - profile: nextcloud-base-ce
      policy: gentian-disallow-privilege-escalation
      scope: collabora
    - profile: nextcloud-base-ce
      policy: gentian-restrict-capabilities
      scope: collabora
    - profile: nextcloud-base-ce
      policy: gentian-require-seccomp
      scope: collabora
      # Collabora's own coolmount tool bind-mounts its systemplate into each
      # per-document jail; RuntimeDefault's seccomp filter blocks the mount()
      # syscall outright regardless of capabilities, so it falls back to
      # copying that folder on every single document open — the fallback
      # upstream's own chart comment documents as much slower. Confirmed live:
      # `coolmount: Operation not permitted` on every jail setup, and Nextcloud
      # richdocuments retrying its WOPI token fetch four times over 47s waiting
      # for one to finish. Scoped to this one container, which already runs
      # non-root with every capability dropped except CHOWN/FOWNER/SYS_CHROOT —
      # see profiles/nextcloud/base/base-ce/profile.yaml.
